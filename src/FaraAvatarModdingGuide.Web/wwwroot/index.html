<!DOCTYPE html>
<html lang="ja" data-bs-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- SEO-HEAD:START -->
    <title>Avatar Modding Guide</title>
    <!-- SEO-HEAD:END -->
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="images/site-icon.svg" />
    <!--
        この index.html は、dotnet publish の出力としてテンプレートになる。Build（src/FaraAvatarModdingGuide.Build）が、
        SEO-HEAD / SEO-BODY の区切りの間に、ページごとの head と本文を差し込んで、ページごとの HTML を書き出す。
        WASM-ONLY の区切りで囲んだ部分（読み込み表示・Blazor のスクリプトなど）は、WebAssembly を使うページだけに残し、それ以外のページ（記事など）からは外す。
        STATIC-ONLY の区切りで囲んだ部分は、その逆（WebAssembly を使わないページだけに残す）。
        CSP（_headers）でインラインの script は止まるので、script は外部ファイルだけにする。
    -->
    <!-- WASM-ONLY:START -->
    <!-- 起動までの読み込み表示。静的な本文は、起動の前から見えたまま残す(本文を覆わない)。画面の右下に小さく「読み込み中…」だけを出す(操作は止めない:
         pointer-events: none。45 秒たっても描かれないときだけ、案内と「再読み込み」のリンクに変わり、リンクだけ押せる)。
         静的な本文の枠は、起動の後の画面と同じ構造・同じ位置(Build の StaticFrame)。起動すると、Blazor が #app の中身を置き換えて、boot-indicator.js(kit)がこの表示を外す。
         最初に当てる(CSS の読み込み前にも色が合うように、インラインで書く)。60 秒の保険は、JS の RELEASE_MS と同じ秒数 -->
    <style>
        html, body { background: #f7f4fd; }
        html[data-bs-theme="dark"], html[data-bs-theme="dark"] body { background: #0c0616; }
        #boot-indicator {
            position: fixed; right: 1rem; bottom: 3.4rem; z-index: 2147483000;
            display: flex; align-items: center; gap: 0.6rem;
            box-sizing: border-box; max-width: calc(100vw - 2rem); padding: 0.45rem 0.95rem;
            border: 1px solid rgba(200, 170, 255, 0.3); border-radius: 999px;
            background: rgba(26, 13, 51, 0.92); color: #f3edff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
            font-family: "Zen Kaku Gothic New", "Yu Gothic", system-ui, sans-serif;
            pointer-events: none;
            animation: boot-indicator-release 0s linear 60s forwards;
        }
        @keyframes boot-indicator-release { to { visibility: hidden; } }
        .boot-indicator-spinner {
            flex: none; width: 1rem; height: 1rem; box-sizing: border-box;
            border: 0.17rem solid #c084fc; border-right-color: transparent; border-radius: 50%;
            animation: boot-indicator-spin 0.75s linear infinite;
        }
        .boot-indicator-label { font-size: 0.8rem; font-weight: 700; line-height: 1.5; }
        .boot-indicator-label:empty::before { content: "読み込み中…"; }
        .boot-indicator-label a { color: #e9d5ff; font-weight: 700; text-decoration: underline; pointer-events: auto; }
        #boot-indicator[data-state="slow"] { pointer-events: auto; }
        #boot-indicator[data-state="slow"] .boot-indicator-spinner { animation: none; }
        @keyframes boot-indicator-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            .boot-indicator-spinner { animation: none; }
        }
    </style>
    <!-- JavaScript が無い環境: 読み込み表示は出さない。スマホは、サイドバー(ハンバーガーで開く一時的なメニュー。JavaScript が無いと開けない)を、本文とフッターの後ろに並べて出す(ページの移動に使える) -->
    <noscript><style>
        #boot-indicator { display: none; }
        @media (max-width: 767.98px) {
            .av-static { display: flex; flex-direction: column; }
            .av-static .mud-main-content { order: 1; }
            .av-static .fsk-sidebar { order: 2; display: block !important; position: static !important; width: auto !important; height: auto !important; overflow: visible !important; }
        }
    </style></noscript>
    <!-- three.js の importmap(練習・記事内チュートリアルの 3D 表示)。three.js は自分のサイトに同梱している(lib/three/。jsDelivr は使わない)。
         この文書で最初の module が読まれる前に置く必要がある(Blazor が後から足したものは効かない)ので、テンプレートの head に 1 つだけ置く。
         CSP は script-src に importmap の sha256 を入れて許可する。ハッシュは Build が、この script の中身(<script> と </script> の間の文字を、そのまま)から計算して _headers に入れる。
         中身を変える(three.js の版を上げる)と、ハッシュも自動で変わる。手では直さない。 -->
    <script type="importmap">{"imports":{"three":"/lib/three/three.module.js"}}</script>
    <!-- WASM-ONLY:END -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- WASM-ONLY:START -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <!-- WASM-ONLY:END -->
    <!-- Bootstrap 5.3.3 から、このサイトで使っているクラスだけを取り出したもの（CDN の Bootstrap・Bootstrap Icons はやめた） -->
    <link href="css/base.css" rel="stylesheet" />
    <!-- 共通部品（fara-site-kit）の CSS。サイトの app.css より前に読む（同じ強さの規則は app.css が勝つ） -->
    <link href="_content/FaraSiteKit.Razor/css/fara-site-kit.css" rel="stylesheet" />
    <!-- 練習・記事内チュートリアルの見た目(SSR 版の site.css から移した)と、練習の JavaScript が出すアイコン(Bootstrap Icons のうち使うものだけを CSS にした) -->
    <link href="css/bi-icons.css" rel="stylesheet" />
    <link href="css/practice.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <!-- 描画の前に、保存されたテーマ（ライト／ダーク）と PC のサイドバーを隠す設定を html に反映する（kit の theme-init.js）。
         data-storage-key・data-sidebar-key は、SiteOptions（Services/SiteInfo.cs の StorageKey・SidebarKey）と同じ値にする（違うと、起動の後にコンソールに警告が出る）。
         storage-migrate.js は、SSR 版が保存していた形（文字列の light / dark）を、kit が読む形（JSON）に直す。theme-init.js より前に読む -->
    <script src="js/storage-migrate.js"></script>
    <script src="_content/FaraSiteKit.Razor/js/theme-init.js" data-storage-key="avatar-modding-guide.theme" data-sidebar-key="avatar-modding-guide.sidebar-hidden"></script>
    <!-- 保存されたテーマが無い・読めないときの既定を、SSR 版と同じダークにする（theme-init.js は light にするので、直後に直す） -->
    <script src="js/theme-default.js"></script>
    <!-- STATIC-ONLY の区切りで囲んだ部分は、WebAssembly を使わないページ（記事など）だけに残す。「更新予定」の帯は、WebAssembly のページでは kit の MaintenanceBanner が出し、
         静的 HTML のページでは、この notice.js が Worker の /api/maintenance を読んで出す -->
    <!-- 背景の飾り(床の方眼と回る針金のアバター。2D の canvas)。全ページで 1 度だけ動く。ページを移っても、本文だけが替わるので、そのまま残る(多重に作らない) -->
    <script src="js/bgscene.js" defer></script>
    <!-- STATIC-ONLY:START -->
    <script src="js/notice.js" defer></script>
    <!-- STATIC-ONLY:END -->
</head>
<body>
    <!-- WASM-ONLY:START -->
    <!-- 起動までの読み込み表示（右下の小さな表示）。#app の外に置く（Blazor が #app の中身を置き換えても残るので、boot-indicator.js（kit）が起動後に外す）。
         静的な本文は、起動の前から見えたまま残す（検索エンジン・JavaScript が無い環境のため）。文言は CSS（:empty::before）で出す -->
    <div id="boot-indicator" class="boot-indicator">
        <div class="boot-indicator-spinner" aria-hidden="true"></div>
        <span class="boot-indicator-label" role="status" aria-live="polite" aria-label="読み込み中"></span>
    </div>
    <!-- WASM-ONLY:END -->
    <div id="app">
        <!-- SEO-BODY:START -->
        <!-- SEO-BODY:END -->
    </div>

    <!-- WASM-ONLY:START -->
    <div id="blazor-error-ui">
        エラーが発生しました。ページを再読み込みしてください。
        <a href="" class="reload">再読み込み</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="js/startup.js"></script>
    <script src="js/search-norm.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/page.js"></script>
    <script src="js/toc.js"></script>
    <script src="js/search-ui.js"></script>
    <script src="_content/FaraSiteKit.Razor/js/boot-indicator.js"></script>
    <script src="_content/FaraSiteKit.Razor/js/fara-site-kit.js"></script>
    <script src="_content/FaraSiteKit.Razor/js/scroll-progress.js"></script>
    <script src="_content/FaraSiteKit.Razor/js/report.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <!-- WASM-ONLY:END -->
</body>
</html>
