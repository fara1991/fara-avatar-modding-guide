# Cloudflare Workers の設定（静的ファイル + 共同練習の部屋）。
# dist/ は `dotnet run -- --export dist` で生成する（.github/workflows/deploy.yml 参照）。
#
#   本番:     master  ブランチ → avatar.fara-labs.com      (npx wrangler deploy --env production)
#   develop:  develop ブランチ → avatar-dev.fara-labs.com  (npx wrangler deploy --env dev)
#   Worker 名は本番 fara-avatar、develop は fara-avatar-dev。
#   ここの name はダッシュボードの Worker 名と一致させる（違うと別の Worker が新しく作られる）。
#
# すべてのリクエストが worker/index.js を通る（run_worker_first = true。確認用ホストに noindex を付けるため）。
# /api/rooms/<ID>/ws は共同練習の部屋（部屋ごとに Durable Object）、それ以外は env.ASSETS で dist/ の静的ファイルを返す。
# Durable Object は SQLite 版（new_sqlite_classes）なので Workers の無料プランでも使える。

name = "fara-avatar"
main = "worker/index.js"
compatibility_date = "2026-10-01"
# workers.dev と preview の URL は使わない（WAF のメンテナンス画面や、確認用の Cloudflare Access をすり抜けないように）
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
# /learn/basics → learn/basics.html、/learn/basics/ → /learn/basics へリダイレクト
html_handling = "auto-trailing-slash"
# 存在しないパスは 404.html を 404 ステータスで返す
not_found_handling = "404-page"
# すべて worker/index.js を先に通す（/api と、確認用ホストの noindex のため）
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[env.production]
name = "fara-avatar"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "avatar.fara-labs.com", custom_domain = true },
]

[env.production.assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

[[env.production.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[env.dev]
name = "fara-avatar-dev"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "avatar-dev.fara-labs.com", custom_domain = true },
]

# 確認用は検索エンジンに載せない（worker/index.js がすべての静的ファイルの応答に X-Robots-Tag: noindex を付ける。
# workers.dev の URL で開かれたときも付くように、ホスト名ではなくこの変数で判断する）
[env.dev.vars]
NOINDEX = "true"

[env.dev.assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

[[env.dev.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"
