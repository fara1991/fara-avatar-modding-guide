# Cloudflare Workers の設定（静的ファイル + 共同練習の部屋）。
# dist/ は `dotnet run -- --export dist` で生成する（.github/workflows/deploy.yml 参照）。
#
#   本番:     master  ブランチ → avatar.fara-labs.com      (npx wrangler deploy --env production)
#   develop:  develop ブランチ → avatar-dev.fara-labs.com  (npx wrangler deploy --env dev)
#   旧アドレスの blender.fara-labs.com も本番の Worker に向け、worker/index.js で avatar.fara-labs.com へ 301 する。
#   Worker 名は本番 fara-blender、develop は fara-avatar-dev（ダッシュボードで改名済み）。
#   ここの name はダッシュボードの Worker 名と一致させる（違うと別の Worker が新しく作られる）。
#
# すべてのリクエストが worker/index.js を通る（run_worker_first = true。旧アドレスの転送のため）。
# /api/rooms/<ID>/ws は共同練習の部屋（部屋ごとに Durable Object）、それ以外は env.ASSETS で dist/ の静的ファイルを返す。
# Durable Object は SQLite 版（new_sqlite_classes）なので Workers の無料プランでも使える。

name = "fara-blender"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# /learn/basics → learn/basics.html、/learn/basics/ → /learn/basics へリダイレクト
html_handling = "auto-trailing-slash"
# 存在しないパスは 404.html を 404 ステータスで返す
not_found_handling = "404-page"
# すべて worker/index.js を先に通す（旧アドレスの転送と /api のため）
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[env.production]
name = "fara-blender"
routes = [
  { pattern = "avatar.fara-labs.com", custom_domain = true },
  { pattern = "blender.fara-labs.com", custom_domain = true }, # 旧アドレス（avatar へ 301）
]

[env.production.assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

[[env.production.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[env.dev]
name = "fara-avatar-dev"
routes = [
  { pattern = "avatar-dev.fara-labs.com", custom_domain = true },
]

[env.dev.assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

[[env.dev.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"
