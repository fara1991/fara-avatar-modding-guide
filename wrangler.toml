# Cloudflare Workers の設定（静的ファイル + 共同練習の部屋）。
# dist/ は `dotnet run -- --export dist` で生成する（.github/workflows/deploy.yml 参照）。
#
#   本番:     master  ブランチ → avatar.fara-labs.com      (npx wrangler deploy --env production)
#   develop:  develop ブランチ → avatar-dev.fara-labs.com  (npx wrangler deploy --env dev)
#   Worker 名は本番 fara-avatar、develop は fara-avatar-dev。
#   ここの name はダッシュボードの Worker 名と一致させる（違うと別の Worker が新しく作られる）。
#
# すべてのリクエストが worker/index.js を通る（run_worker_first = true。メンテナンス表示・報告の受け口のため）。
# /api/rooms/<ID>/ws は共同練習の部屋（部屋ごとに Durable Object）、それ以外は env.ASSETS で dist/ の静的ファイルを返す。
# Durable Object は SQLite 版（new_sqlite_classes）なので Workers の無料プランでも使える。

name = "fara-avatar"
main = "worker/index.js"
compatibility_date = "2026-10-01"
# ダッシュボードで足した変数（MAINTENANCE_MODE・MAINTENANCE_MESSAGE など）を、公開（wrangler deploy）のたびに消さない
keep_vars = true
# workers.dev と preview の URL は使わない（WAF のメンテナンス画面や、確認用の Cloudflare Access をすり抜けないように）
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
# /learn/basics → learn/basics.html、/learn/basics/ → /learn/basics へリダイレクト
html_handling = "auto-trailing-slash"
# 存在しないパスは 404.html を 404 ステータスで返す
not_found_handling = "404-page"
# すべて worker/index.js を先に通す（/api・報告・メンテナンス表示のため）
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[env.production]
name = "fara-avatar"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "avatar.fara-labs.com", custom_domain = true },
]

[env.production.assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

[[env.production.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[env.dev]
name = "fara-avatar-dev"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "avatar-dev.fara-labs.com", custom_domain = true },
]

# 確認用の noindex（X-Robots-Tag）は、公開のワークフロー（.github/workflows/deploy.yml）が dist/_headers に付ける（ポケモンのサイトと同じ）

[env.dev.assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

[[env.dev.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# ---------------------------------------------------------------------------
# 移行（Blazor WebAssembly + MudBlazor。docs/wasm-migration-plan.md）の確認用。長期ブランチ migration/wasm への push で公開する
#   wasm-dev: migration/wasm ブランチ → avatar-wasm-dev.fara-labs.com （npx wrangler deploy --env wasm-dev。.github/workflows/deploy-wasm-dev.yml）
#   Worker 名は fara-avatar-wasm-dev。Worker とカスタムドメインは、最初の公開で自動で作られる（Cloudflare Access で、ユーザーだけが見られるようにする）。
#   本番・develop（avatar-dev）とは別の Worker なので、共同練習の部屋（Durable Object）も別々。MAINTENANCE_MODE は付けない（公開してもメンテナンス画面にならない）。
#   静的ファイルは dotnet publish の出力（publish/wwwroot）に、Build が本文入りの HTML などを書き足したもの。
#   html_handling・not_found_handling は他の環境と同じ（/learn/basics → learn/basics.html、存在しないパスは 404.html を 404 で返す）。
# ---------------------------------------------------------------------------
[env.wasm-dev]
name = "fara-avatar-wasm-dev"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "avatar-wasm-dev.fara-labs.com", custom_domain = true },
]

[env.wasm-dev.assets]
directory = "./publish/wwwroot"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

[[env.wasm-dev.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Durable Object（共同練習の部屋）は、新しい Worker では、このマイグレーションで作られる
[[env.wasm-dev.migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
