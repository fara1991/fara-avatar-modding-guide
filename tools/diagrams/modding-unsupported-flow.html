<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><link rel="stylesheet" href="steps.css"></head><body><div class="card">
<h1>非対応衣装を着せる流れ</h1>
<div class="sub">途中で戻ることも多いので、区切りごとに別名で保存しておくと安心です。</div>
<div class="group"><span class="glabel other">最初に</span>
<div class="steps">
  <div class="step other"><div class="n">1</div><div class="t">規約を確かめる</div><div class="d">衣装の改変・アバターのウェイトの流用が認められているか</div></div>
</div></div>
<div class="group"><span class="glabel blender">Blender で作業する</span>
<div class="steps">
  <div class="step blender"><div class="n">2</div><div class="t">アバターと衣装を読み込む</div></div>
  <div class="step blender"><div class="n">3</div><div class="t">スケールを適用する</div></div>
  <div class="step blender"><div class="n">4</div><div class="t">位置と大きさを合わせる</div></div>
  <div class="step blender"><div class="n">5</div><div class="t">関節（ボーン）の位置を合わせる</div></div>
  <div class="step blender"><div class="n">6</div><div class="t">頂点グループの名前をそろえる</div></div>
  <div class="step blender"><div class="n">7</div><div class="t">アバターの体からウェイトを転送する</div></div>
  <div class="step blender"><div class="n">8</div><div class="t">関節を曲げて確かめ、手で直す</div></div>
  <div class="step blender"><div class="n">9</div><div class="t">貫通を直す</div></div>
</div></div>
<div class="group"><span class="glabel unity">Unity で着せる</span>
<div class="steps">
  <div class="step unity"><div class="n">10</div><div class="t">FBX に書き出して Unity で着せる</div></div>
</div></div>
<div class="note info">うまくいかないときは、症状ごとのチェックリストで原因を順に確かめます。</div>
</div></body></html>
