<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><link rel="stylesheet" href="steps.css"></head><body><div class="card">
<h1>首すげ替えとは</h1>
<div class="sub">アバター A の頭を、アバター B の体（首から下）につなぐ改変です。</div>
<div class="cols">
  <div class="box a"><div class="t">アバター A</div><div class="d">頭（顔）を使う</div></div>
  <div class="box b"><div class="t">アバター B</div><div class="d">体形・対応衣装を使う</div></div>
</div>
<div class="join">▼ 首でつなぐ ▼</div>
<div class="hard">
  <div class="row"><b>ボーンのつなぎ方（2 節）</b>頭がついてこない、Unity で Humanoid のエラー</div>
  <div class="row"><b>首の継ぎ目の形（3 節）</b>首の後ろなどに切れ目が見える</div>
  <div class="row"><b>継ぎ目のウェイト（4 節）</b>首を傾けると切れ目が開く</div>
  <div class="row"><b>色と明るさ（5・6 節）</b>首と顔の色が違う、ワールドによって明るさが違う</div>
</div>
<div class="note warn"><b>両方のアバターの規約</b>で、改変・他アバターとの組み合わせが認められているか確かめます。</div>
</div></body></html>
