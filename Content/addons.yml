  source: discord

- name: Better FBX Importer & Exporter
  description: 高機能な FBX 入出力（Maya 製アバターのシェイプキー名の問題などを補正）の有料アドオン
  type: ユーティリティ
  price: 有料
  note: 現行も販売。書き出し設定によって法線が変わる事例があるので標準エクスポーターとの比較推奨。
  url: https://blendermarket.com/products/better-fbx-importer--exporter
  source: discord
