- name: Hide Only Vertex (Lock Vertex)
  description: 選択した頂点だけを編集不可（固定）にする有料アドオン
  type: モデリング
  price: 有料
  note: 対応バージョン未確認。標準のプロポーショナル編集「接続のみ」や H 非表示で代替可能。
  url: https://bookyakuno.gumroad.com/l/hide_only_vertex
  source: discord

- name: ApplyModifier
  description: シェイプキーのあるメッシュにモディファイアーを適用できるようにするアドオン
  type: モデリング
  price: 無料
  note: Blender 標準では今もシェイプキー付きメッシュへの適用は不可のため需要あり。4.5 対応はリポジトリで確認してください。
  url: https://github.com/Taremin/ApplyModifier
  source: discord

- name: Blender Asset Creation Toolset
