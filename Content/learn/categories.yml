# 目次のカテゴリ。上から順に読む想定で並べる。
# id はディレクトリ名 (Content/learn/<id>/) と URL (/learn/<id>) に使われる。
# section は sections.yml の id（Blender / Unity / VRChat / 通しで作る）。目次はその区切りごとにまとまる。

- id: getting-started
  section: blender
  title: はじめに
  description: Blender のインストール、画面の見方、視点の動かし方。
  icon: bi-rocket-takeoff

- id: basics
  section: blender
  title: 基本操作
  description: オブジェクトの選択・移動・回転・拡縮など、すべての作業の土台になる操作。
  icon: bi-arrows-move

- id: modeling
  section: blender
  title: モデリング
  description: 編集モードで頂点・辺・面を操作して形を作る。
  icon: bi-box

- id: materials
  section: blender
  title: マテリアルとテクスチャ
  description: 色や質感を設定し、画像テクスチャを貼る。
  icon: bi-palette

- id: rigging
  section: blender
  title: リギング
  description: ボーンを入れてキャラクターを動かせるようにする。
  icon: bi-person-arms-up

- id: unity
  section: unity
  title: Unity でアバターを整える
  description: Unity の画面の見方、Modular Avatar での衣装の着せ方、lilToon、アップロード前の確認。
  icon: bi-grid-3x3-gap

- id: avatar-clothing
  section: practice
  title: 実践：アバター用衣装の作成
  description: VRChat などで使うアバターの衣装を、インポートから Unity での設定まで通して作る。
  icon: bi-person-standing-dress
