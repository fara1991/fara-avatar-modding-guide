# 更新履歴。ホームには新しい 3 件の見出し（title）だけ、/changelog には細かい内容（items）まで載る。新しいものを上に書く。
#
#   date:  日付（YYYY-MM-DD）
#   title: 短い見出し（ホームにも出るので 1 行で）
#   items: 細かい内容（1 項目 1 文）

- date: 2026-10-22
  title: 背景のオブジェクトを左側にも表示
  items:
    - 背景の Blender 風のオブジェクト（立方体・球・円錐・トーラス）が右側に偏っていたので、左側にも置いて、左右で釣り合うようにしました

- date: 2026-10-22
  title: フッターを追加、「問い合わせ」とプライバシーポリシーのページ
  items:
    - 全ページの下に、「サイト名 | 問い合わせ | プライバシーポリシー | © 2026 Fara」のフッターを付けました（Fara は作者のホームページへ）
    - 「問い合わせ」から、記事の間違い・不具合・要望を作者に直接送れます。内容は作者のチャット（Discord）に通知されます。ボット対策に Cloudflare Turnstile を使っています
    - プライバシーポリシーのページを追加しました（ブラウザへの保存・共同練習・外部サービス・問い合わせで送る情報）
    - 対象バージョン（Blender / Unity）と GitHub のリンクは、ホームのタイトルの下に移しました

- date: 2026-10-22
  title: 背景に Blender 風のオブジェクト、色とホームのタイトルを整理
  items:
    - 背景に、Blender の 3D ビューのような床の方眼と、回る基本オブジェクト（立方体・球・円錐・円柱・トーラスなど）を描くようにしました
    - サイト全体の色を、ポケモン・Bot のサイトと同じ紫系に揃えました
    - ホームのタイトルを、四角で囲まず、ほかのサイトと同じグラデーションの文字にしました
    - 検索で、カタカナ・ひらがな・ローマ字のどれで打っても探せるようにしました

- date: 2026-10-21
  title: サイドバーを隠せるように、ヘッダーに検索とテーマ切り替えをまとめました
  items:
    - サイドバーをハンバーガーで隠せるようにし、状態を覚えるようにしました
    - 検索とライト／ダークの切り替えを、上のヘッダーに集めました
    - 隠したときは、アイコンだけの細い列を残すようにしました

- date: 2026-10-13
  title: 操作の練習・リンクの表示を修正
  items:
    - 練習ページがスマホで使いやすいように、表示を直しました
    - 目次の見出しの読み上げ（アクセシビリティ）と、ページ内リンクの動きを直しました
    - 「本文へスキップ」リンクの見た目を直しました

- date: 2026-10-11
  title: サイト名を Avatar Modding Guide に変更、記事・TIPS・練習を追加
  items:
    - サイト名を Avatar Modding Guide にし、公開先を avatar.fara-labs.com にしました
    - Blender のモデリングや VRChat のアップロードなどの記事を追加しました
    - TIPS・用語集・何て名前？・改変 Q&A・リンク集を追加しました
    - Unity の練習と、みんなで練習できる部屋を追加しました
    - 全体を横断して探せる検索を追加しました
