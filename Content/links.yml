# リンク集。/links に区切りごとに表示され、検索の対象になる。区切りは Data/ContentService.cs の LinkCategories。
#
#   id:          URL のアンカー（/links#id）。BOOTH の商品は booth-<商品番号>
#   name:        名前（商品名・記事名）
#   url:         リンク先
#   category:    unity-tool / vrchat / reference / booth-avatar / booth-outfit
#   description: 1 行の説明
#   note:        補足（対応バージョン、今の代わりになるものなど）
#   status:      current（今も使われている）/ old（古い情報・販売終了の可能性）/ 省略（わからない）
#   source:      manual（既定）/ discord（Discord で紹介されたもの）
#
# Blender のアドオンは Content/addons.yml（/addons）に書く。

