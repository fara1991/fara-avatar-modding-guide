# 用語集。/glossary に読みの順で表示され、サイト内検索の対象になる。
#
#   id:          URL のアンカー（/glossary#id）。英小文字・数字・ハイフン
#   term:        用語（日本語 UI の表記があればそれ）
#   reading:     読み（ひらがな。並び順に使う）
#   en:          英語 UI での表記
#   description: 説明（Markdown。1〜3 文）
#   tags:        Blender / Unity / VRChat / Modular Avatar / モデリング / ウェイト / マテリアル / UV / リギング / 書き出し など
#   shortcuts:   関連するキー（Content/shortcuts.yml の key と同じ表記ならリンクになる）
#   articles:    関連する記事（"カテゴリ/スラッグ"）
#   related:     関連する用語の id
#   source:      manual（既定）/ discord（Discord の会話から起こした項目）
#
# 対象: Blender 4.5 / Unity 2022.3 + VRChat SDK3（Avatars）+ Modular Avatar

# ---------------------------------------------------------------- Blender: 基本
- id: object-mode
  term: オブジェクトモード
  reading: おぶじぇくともーど
  en: Object Mode
  description: オブジェクトを丸ごと選んで、移動・回転・スケール・追加・削除をするモード。メッシュの中身（頂点・辺・面）はいじれない。
  tags: [Blender]
  shortcuts: [Tab]
  articles: [basics/select, basics/transform]
  related: [edit-mode]

- id: edit-mode
  term: 編集モード
  reading: へんしゅうもーど
  en: Edit Mode
  description: メッシュの頂点・辺・面を直接動かして形を作るモード。<kbd>Tab</kbd> でオブジェクトモードと切り替える。
  tags: [Blender, モデリング]
  shortcuts: [Tab, "1", "2", "3"]
  articles: [modeling/edit-mode]
  related: [object-mode, vertex, edge, face]

- id: pose-mode
  term: ポーズモード
  reading: ぽーずもーど
  en: Pose Mode
  description: アーマチュアのボーンを動かしてポーズを付けるモード。ここでの変形はボーンの形そのもの（編集モード）とは別に保存される。
  tags: [Blender, リギング]
  shortcuts: [Ctrl+Tab]
  articles: [rigging/armature]
  related: [armature, bone]

- id: weight-paint-mode
  term: ウェイトペイント
  reading: うぇいとぺいんと
  en: Weight Paint
  description: メッシュの上を筆で塗って、各頂点がボーンにどれだけ引っ張られるか（ウェイト）を決めるモード。赤が 1、青が 0。
  tags: [Blender, ウェイト]
  shortcuts: [Ctrl+クリック]
  articles: [rigging/weight-paint]
  related: [weight, vertex-group]

- id: vertex
  term: 頂点
  reading: ちょうてん
  en: Vertex
  description: メッシュを作る点。辺と面は頂点どうしをつないでできている。<kbd>1</kbd> で頂点選択モード。
  tags: [Blender, モデリング]
  shortcuts: ["1"]
  articles: [modeling/edit-mode]
  related: [edge, face]

- id: edge
  term: 辺
  reading: へん
  en: Edge
  description: 2 つの頂点を結ぶ線。<kbd>2</kbd> で辺選択モード。辺ループ（<kbd>Alt</kbd>+クリック）でひと続きの辺をまとめて選べる。
  tags: [Blender, モデリング]
  shortcuts: ["2", Alt+クリック]
  articles: [modeling/edit-mode]
  related: [vertex, face, edge-loop]

- id: face
  term: 面
  reading: めん
  en: Face
  description: 3 つ以上の頂点で囲まれた面（ポリゴン）。<kbd>3</kbd> で面選択モード。四角形でそろえるのが基本。
  tags: [Blender, モデリング]
  shortcuts: ["3"]
  articles: [modeling/edit-mode, modeling/topology]
  related: [ngon, normal]

- id: edge-loop
  term: 辺ループ
  reading: へんるーぷ
  en: Edge Loop
  description: 四角形の面をまたいで一周つながった辺の列。<kbd>Alt</kbd>+クリックで選び、<kbd>Ctrl</kbd>+<kbd>R</kbd>（ループカット）で増やす。
  tags: [Blender, モデリング]
  shortcuts: [Alt+クリック, Ctrl+R]
  articles: [modeling/edit-mode, modeling/extrude-inset-loopcut]
  related: [loop-cut]

- id: ngon
  term: N ゴン
  reading: えぬごん
  en: N-gon
  description: 頂点が 5 つ以上ある面。ループカットが通らず、曲げたときに崩れやすいので、最終的には四角形か三角形に分ける。
  tags: [Blender, モデリング]
  articles: [modeling/topology]
  related: [face, topology]

- id: normal
  term: 法線
  reading: ほうせん
  en: Normal
  description: 面の表側の向き。裏返った面は黒く見えたり、Unity で透明になったりする。<kbd>Shift</kbd>+<kbd>N</kbd> で外側にそろえる。
  tags: [Blender, モデリング, Unity]
  shortcuts: [Shift+N]
  articles: [modeling/mirror-smooth, modeling/topology]
  related: [face]

- id: topology
  term: トポロジー
  reading: とぽろじー
  en: Topology
  description: 頂点・辺・面のつながり方。関節をまたぐループの本数や、四角形でそろっているかが、曲げたときの見た目に直接出る。
  tags: [Blender, モデリング]
  articles: [modeling/topology]
  related: [ngon, edge-loop]

- id: origin
  term: 原点
  reading: げんてん
  en: Origin
  description: オブジェクトの位置・回転・スケールの基準になる点（オレンジの小さな点）。メッシュの中心とは限らない。
  tags: [Blender]
  articles: [basics/origin-pivot-snap]
  related: [cursor-3d, pivot-point, apply-transform]

- id: cursor-3d
  term: 3D カーソル
  reading: すりーでぃーかーそる
  en: 3D Cursor
  description: 赤白の輪。新しいオブジェクトはここに追加され、回転や原点の基準にもできる。<kbd>Shift</kbd>+<kbd>S</kbd> で動かす。
  tags: [Blender]
  shortcuts: [Shift+S]
  articles: [basics/origin-pivot-snap]
  related: [origin, pivot-point]

- id: pivot-point
  term: ピボットポイント
  reading: ぴぼっとぽいんと
  en: Pivot Point
  description: 回転・スケールの中心をどこにするかの設定（中点、各原点、3D カーソル、アクティブ要素など）。ヘッダーで切り替える。
  tags: [Blender]
  articles: [basics/origin-pivot-snap]
  related: [origin, cursor-3d]

- id: snap
  term: スナップ
  reading: すなっぷ
  en: Snap
  description: 動かしたものを頂点・辺・面・グリッドなどにぴったり吸い付ける機能。操作中に <kbd>Ctrl</kbd> を押すと一時的に有効になる。
  tags: [Blender]
  articles: [basics/origin-pivot-snap, basics/transform]

- id: apply-transform
  term: トランスフォームの適用
  reading: とらんすふぉーむのてきよう
  en: Apply Transform
  description: 今の位置・回転・スケールをメッシュに焼き込み、値を 0 / 0° / 1 に戻す操作（<kbd>Ctrl</kbd>+<kbd>A</kbd>）。書き出し前やモディファイアーの前に行う。
  tags: [Blender, 書き出し]
  shortcuts: [Ctrl+A]
  articles: [basics/transform, avatar-clothing/export-fbx]
  related: [origin]

- id: outliner
  term: アウトライナー
  reading: あうとらいなー
  en: Outliner
  description: 画面右上の、シーンの中身を一覧にしたパネル。目のアイコンで表示・非表示、ドラッグで親子付けやコレクションの移動ができる。
  tags: [Blender]
  articles: [basics/outliner]
  related: [collection, parent]

- id: collection
  term: コレクション
  reading: これくしょん
  en: Collection
  description: オブジェクトをまとめるフォルダのようなもの。体・服・ボーンを分けておくと、表示の切り替えや書き出しが楽になる。<kbd>M</kbd> で移動。
  tags: [Blender]
  shortcuts: [M]
  articles: [basics/outliner]
  related: [outliner]

- id: parent
  term: 親子関係（ペアレント）
  reading: おやこかんけい
  en: Parent
  description: 親を動かすと子も一緒に動く関係。<kbd>Ctrl</kbd>+<kbd>P</kbd> で設定、<kbd>Alt</kbd>+<kbd>P</kbd> で解除。メッシュをアーマチュアの子にすると、ボーンで変形できる。
  tags: [Blender, リギング]
  shortcuts: [Ctrl+P, Alt+P]
  articles: [rigging/parent-weights]
  related: [armature]

# ---------------------------------------------------------------- Blender: モデリングの操作
- id: extrude
  term: 押し出し
  reading: おしだし
  en: Extrude
  description: 選んだ面（辺・頂点）を引き出して、側面に新しい面を作る（<kbd>E</kbd>）。押したあとキャンセルしても複製は残るので注意。
  tags: [Blender, モデリング]
  shortcuts: [E]
  articles: [modeling/extrude-inset-loopcut]
  related: [inset, merge]

- id: inset
  term: 面を差し込む
  reading: めんをさしこむ
  en: Inset Faces
  description: 面の内側にひと回り小さい面を作る（<kbd>I</kbd>）。窓や縁取りの出発点。
  tags: [Blender, モデリング]
  shortcuts: [I]
  articles: [modeling/extrude-inset-loopcut]
  related: [extrude]

- id: loop-cut
  term: ループカット
  reading: るーぷかっと
  en: Loop Cut
  description: 一周する辺ループを追加する（<kbd>Ctrl</kbd>+<kbd>R</kbd>）。ホイールで本数、位置調整で右クリックすると真ん中に入る。
  tags: [Blender, モデリング]
  shortcuts: [Ctrl+R]
  articles: [modeling/extrude-inset-loopcut]
  related: [edge-loop]

- id: bevel
  term: ベベル
  reading: べべる
  en: Bevel
  description: 辺の角を面取りする（<kbd>Ctrl</kbd>+<kbd>B</kbd>）。ホイールで分割数を増やすと丸くなる。
  tags: [Blender, モデリング]
  shortcuts: [Ctrl+B]
  articles: [modeling/bevel-knife-merge]

- id: knife
  term: ナイフ
  reading: ないふ
  en: Knife
  description: メッシュの上をなぞって切る（<kbd>K</kbd>）。三角形や N ゴンができやすいので、ループカットで済むならそちらを使う。
  tags: [Blender, モデリング]
  shortcuts: [K]
  articles: [modeling/bevel-knife-merge]
  related: [loop-cut]

- id: merge
  term: マージ
  reading: まーじ
  en: Merge
  description: 選んだ頂点を 1 つにまとめる（編集モードで <kbd>M</kbd>）。「距離で」は重なった頂点の掃除に使う。オブジェクトどうしをまとめるのは **統合**（<kbd>Ctrl</kbd>+<kbd>J</kbd>）。
  tags: [Blender, モデリング]
  shortcuts: [M]
  articles: [modeling/bevel-knife-merge, modeling/topology]
  related: [join, duplicate-vertices]

- id: join
  term: 統合
  reading: とうごう
  en: Join
  description: 選んだ複数のメッシュオブジェクトを、アクティブなオブジェクトに 1 つにまとめる（オブジェクトモードで <kbd>Ctrl</kbd>+<kbd>J</kbd>）。頂点はくっつかない。
  tags: [Blender]
  shortcuts: [Ctrl+J]
  articles: [basics/select, modeling/bevel-knife-merge]
  related: [merge, separate]

- id: separate
  term: 分離
  reading: ぶんり
  en: Separate
  description: 編集モードで選んだ部分を別のオブジェクトに分ける（<kbd>P</kbd>）。「パーツごと」で、つながっていない部分ごとに分けられる。
  tags: [Blender, モデリング]
  shortcuts: [P]
  articles: [modeling/bevel-knife-merge]
  related: [join]

- id: dissolve
  term: 溶解
  reading: ようかい
  en: Dissolve
  description: 頂点・辺・面を、穴を開けずに消す（<kbd>X</kbd> > 辺を溶解 など）。両側の面が 1 つにつながる。
  tags: [Blender, モデリング]
  shortcuts: [X]
  articles: [modeling/bevel-knife-merge, modeling/topology]

- id: duplicate-vertices
  term: 重複頂点
  reading: ちょうふくちょうてん
  en: Duplicate Vertices
  description: 同じ位置に重なった頂点。見た目ではわからないが、スムーズシェードで筋が出たり自動ウェイトが失敗したりする。<kbd>M</kbd> > 距離で まとめて消す。
  tags: [Blender, モデリング]
  shortcuts: [M]
  articles: [modeling/topology]
  related: [merge]

- id: shade-smooth
  term: スムーズシェード
  reading: すむーずしぇーど
  en: Shade Smooth
  description: 面の境目をぼかして、なめらかに見せる（頂点は増えない）。角を残したいところがあれば「自動スムーズシェード」（Shade Auto Smooth）を使う。
  tags: [Blender, モデリング]
  articles: [modeling/mirror-smooth]

# ---------------------------------------------------------------- Blender: モディファイアー
- id: modifier
  term: モディファイアー
  reading: もでぃふぁいあー
  en: Modifier
  description: 元のメッシュを壊さずに、ミラー・厚み付け・なめらかにするなどの効果を重ねる仕組み。上から順に効く。「適用」で形が確定する。
  tags: [Blender, モデリング]
  articles: [basics/modifiers]
  related: [mirror-modifier, subdivision-surface, solidify]

- id: mirror-modifier
  term: ミラー
  reading: みらー
  en: Mirror
  description: メッシュを原点を通る面で反転してコピーするモディファイアー。半分だけ作れば左右対称になる。中央の頂点はクリッピングとマージで固定する。
  tags: [Blender, モデリング]
  articles: [modeling/mirror-smooth, basics/modifiers]
  related: [modifier]

- id: subdivision-surface
  term: サブディビジョンサーフェス
  reading: さぶでぃびじょんさーふぇす
  en: Subdivision Surface
  description: 面を細かく分けて、丸くなめらかにするモディファイアー。レベル 1 で面が 4 倍になるので、アバターでは使いどころを絞る。
  tags: [Blender, モデリング]
  articles: [modeling/mirror-smooth]
  related: [modifier]

- id: solidify
  term: ソリッド化
  reading: そりっどか
  en: Solidify
  description: 板状のメッシュに厚みを付けるモディファイアー。服の生地の厚みに使う。厚みの向きは法線で決まる。
  tags: [Blender, モデリング]
  articles: [basics/modifiers, avatar-clothing/base-shape]
  related: [normal, modifier]

- id: shrinkwrap
  term: シュリンクラップ
  reading: しゅりんくらっぷ
  en: Shrinkwrap
  description: メッシュを別のオブジェクト（体など）の表面に吸い付けるモディファイアー。服を体に沿わせるときに使う。
  tags: [Blender, モデリング]
  articles: [basics/modifiers, avatar-clothing/base-shape]
  related: [modifier]

- id: data-transfer
  term: データ転送
  reading: でーたてんそう
  en: Data Transfer
  description: 別のメッシュから、頂点グループ（ウェイト）や法線などを近い頂点にコピーするモディファイアー。体のウェイトを服に移すときに使う。
  tags: [Blender, ウェイト]
  articles: [avatar-clothing/weight-transfer]
  related: [vertex-group, weight]

# ---------------------------------------------------------------- Blender: リギング
- id: armature
  term: アーマチュア
  reading: あーまちゅあ
  en: Armature
  description: ボーンの集まり（骨格）。メッシュをアーマチュアに親子付けし、ウェイトを付けると、ボーンを動かしたときにメッシュが変形する。
  tags: [Blender, リギング]
  articles: [rigging/armature]
  related: [bone, parent, weight]

- id: bone
  term: ボーン
  reading: ぼーん
  en: Bone
  description: アーマチュアの中の 1 本の骨。名前で頂点グループと対応する。VRChat 向けでは、アバターの決まった名前（Hips、Spine など）に合わせる。
  tags: [Blender, リギング, Unity]
  articles: [rigging/armature]
  related: [armature, vertex-group]

- id: weight
  term: ウェイト
  reading: うぇいと
  en: Weight
  description: 頂点がそれぞれのボーンにどれだけ引っ張られるかの値（0〜1）。頂点ごとの合計は 1 にそろえる（正規化）。
  tags: [Blender, ウェイト]
  articles: [rigging/parent-weights, rigging/weight-paint]
  related: [vertex-group, weight-paint-mode, data-transfer]
  keywords: [正規化]
  body: |-
    **ウェイト（頂点グループ）とは**

    ウェイトは「どの頂点がどのボーンにどれだけ追従するか」を 0〜1 で表したものです。Blender ではボーン名と同じ名前の頂点グループとして保存され、Armature モディファイアーがそれを使ってメッシュを変形します。

    - 頂点グループ名とボーン名が一致していることで、メッシュとボーンが対応します。名前が違うと追従しません。
    - 1 つの頂点に複数のボーンのウェイトが乗る場合、合計が 1 になるよう正規化されているのが基本です。
    - ウェイトペイントモードでは、青（0）〜赤（1）の色で表示されます。
    - 衣装を別のアバターに合わせるときは、素体からのウェイト転送と手塗りの調整を組み合わせます（[ウェイト転送](/howto#copy-weights)）。
    - 非対応衣装の着せ替えで最も時間がかかるのがウェイト調整です。
  source: discord

- id: vertex-group
  term: 頂点グループ
  reading: ちょうてんぐるーぷ
  en: Vertex Group
  description: 頂点に名前とウェイトを付けたまとまり。ボーンと同じ名前の頂点グループが、そのボーンのウェイトになる。プロパティの「データ」タブにある。
  tags: [Blender, ウェイト]
  articles: [rigging/parent-weights, rigging/weight-paint]
  related: [weight, bone]

- id: automatic-weights
  term: 自動のウェイトで
  reading: じどうのうぇいとで
  en: With Automatic Weights
  description: 親子付け（<kbd>Ctrl</kbd>+<kbd>P</kbd>）のときに、ボーンからの距離でウェイトを自動で付ける方法。重複頂点やスケールのずれがあると失敗しやすい。
  tags: [Blender, ウェイト, リギング]
  shortcuts: [Ctrl+P]
  articles: [rigging/parent-weights]
  related: [weight, duplicate-vertices]

- id: shape-key
  term: シェイプキー
  reading: しぇいぷきー
  en: Shape Key
  description: メッシュの形の差分を保存して、0〜1 で混ぜる仕組み。表情や体型の変化に使う。Unity ではブレンドシェイプと呼ばれる。
  tags: [Blender, リギング, Unity]
  articles: [rigging/shape-keys]
  related: [blendshape-sync]
  keywords: [Basis]
  body: |-
    **シェイプキーの基本**

    - シェイプキーは Basis（基準の形）との差分で形を保存する
    - 値は 0〜1 で、範囲の最小・最大を変えると 1 を超える変形もできる
    - 編集モードでの変更は、アクティブなシェイプキーに入る
    - 左右に分ける、ミラー、シェイプに反映（Propagate to Shapes）などの操作がある
    - 関連: [Basis を編集したら戻る](/qa#shapekey-edit-basis)、[シェイプキーの転送](/qa#shapekey-transfer)
  source: discord

# ---------------------------------------------------------------- Blender: マテリアル・UV・書き出し
