# ---------------------------------------------------------------- Blender: 形を作る
- id: merge-vertices
  question: 頂点をくっつけたい
  answer: マージ
  answer_en: Merge
  menu: 編集モード > メッシュ > マージ
  menu_en: Edit Mode > Mesh > Merge
  shortcuts: [M]
  note: 「中心に」「カーソル位置に」「距離で」などから選ぶ。**オブジェクトどうし**を 1 つにしたいなら **統合**（<kbd>Ctrl</kbd>+<kbd>J</kbd>）。統合しただけでは頂点はくっつかないので、つなげたい頂点はそのあとマージする。
  aliases: [頂点を結合, 頂点を一つにしたい, くっつける]
  tags: [Blender, モデリング]
