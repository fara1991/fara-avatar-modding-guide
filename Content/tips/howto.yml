  note: 衣装のアーマチュアに MA Merge Armature、衣装のルートに MA Outfit Root と MA Mesh Settings が付き、アップロード時に衣装のボーンがアバターのボーンへ統合される。衣装がそのアバターに対応しているか先に確かめる。
  aliases: [着せ替え, 衣装を入れる, 服を着せる]
  tags: [Unity, Modular Avatar]
  articles: [avatar-clothing/unity-setup]
  related: [setup-outfit, merge-armature, prefab]
  body: |-
    **対応衣装を着せる（現行: Modular Avatar の Setup Outfit）**

    対応衣装は、衣装の Prefab をアバターの子に置き、右クリックメニューの Modular Avatar「Setup Outfit」を実行するだけで着せられます。Blender での結合や手動のボーン入れ子は不要です。

    1. Modular Avatar（MA）を VCC / ALCOM でプロジェクトに追加します。
    2. アバターと衣装の unitypackage をインポートし、アバターの Prefab を Hierarchy に置きます。
    3. 衣装の **Prefab**（FBX ではなく）をアバターのルートの子にドラッグします。
    4. 衣装のルートを右クリック → `Modular Avatar > Setup Outfit` を実行します。衣装のボーンがアップロード時にアバターのボーンへ統合されます。
    5. 元の服を消す場合は、元の服メッシュを非アクティブにし、Tag を EditorOnly にします（非アクティブにしただけのものもアップロードに含まれます）。素体が衣装を突き抜ける場合は、作者が用意したシェイプキー（体を細くする等）を設定します。
    - 衣装の切り替えをメニューから行いたい場合は [衣装・小物の ON/OFF](/howto#toggle-objects) を参照してください。
    - **当時の方法**: Blender でアバターと衣装のアーマチュアを結合してボーンを統合する方法（[Blender で対応衣装を着せる](/qa#dress-compatible-outfit-blender-old)）や、Unity 上で衣装ボーンを素体ボーンの子に入れる方法、Auto Dresser などのツールが使われていました。
  source: discord

