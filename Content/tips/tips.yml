  source: discord

- id: transform-axis-normal
  title: 円形に並んだボーンや頂点を中心方向へまとめて移動する
  reading: えんけいにならんだぼーんやちょうてんをちゅうしんほうこうへまとめてうごかす
  summary: トランスフォーム座標系を「ノーマル」、ピボットポイントを「それぞれの原点」にして Z 方向に移動すると、各要素を自分の向きに沿って動かせます。
  body: |-
    1. 移動したい複数のボーン（または頂点）を選択します。
    2. 3D ビューポート上部の **トランスフォーム座標系** を `ノーマル` にします。
    3. **ピボットポイント**（`.` キー）を `それぞれの原点` にします。
    4. `G` → `Z`（座標系のローカル軸）で移動すると、各ボーンがそれぞれの向きに沿って中心方向へ動きます。
    - スケールで縮めるとボーンの大きさまで変わりますが、この方法なら位置だけ動かせます。
    - 胸周りのフィッティングでプロポーショナル編集と組み合わせるのにも便利です。
  tags: [Blender, リギング]
  articles: [basics/origin-pivot-snap]
  related: [pivot-point]
  source: discord

- id: face-custom-normals
  title: Blender で表情を編集したら特定のワールドで顔に皺のような影が出る
  reading: ぶれんだーでひょうじょうをへんしゅうしたらとくていのわーるどでかおにしわのようなかげがでる
  summary: トゥーン向けに整えられていた顔のカスタム法線が編集で崩れています。データ転送などで元の顔（または整形用メッシュ）からカスタム法線を転写し直すときれいになります。
  body: |-
    - 顔のシェイプキーやメッシュを Blender で編集すると、作者が設定していた **カスタム法線** が崩れ、ライトの強いワールドで皺のような影が出ることがあります。
    - 対処: 元のメッシュなどから「データ転送」でカスタム法線を転写し直します（外部記事「blenderでToon用に顔の法線を整える」が参考になります）。
    - 目など一部だけ転写しない（別メッシュにしてから結合）ことで、目だけリアル寄りの反射にするといった使い分けもできます。
  tags: [Blender, 表情, マテリアル]
  related: [normal, data-transfer]
  source: discord

- id: underwear-separate-mesh
  title: 下着やスパッツは別メッシュにしておくと衣装に合わせて切り替えやすい
  reading: したぎやすぱっつはべつめっしゅにしておくといしょうにあわせてきりかえやすい
  summary: 素体と一体化した下着などは Blender で別メッシュに分けておくと、衣装に応じて Unity で ON/OFF できます。透過テクスチャで消すより管理が楽です。
  body: |-
    - 下着・スパッツなどを別メッシュ（`P` → 選択で分離）にしておき、Unity でトグルできるようにします。
    - 素体とは別ファイル（衣装側）に下着が付いているアバターでは、それを読み込んで下着だけ素体側へ移し、Armature モディファイアーを素体のアーマチュアに設定します。
    - スパッツを描いた素肌テクスチャを用意してテクスチャで切り替える方法もあります。
    - 下着姿のベースモデルを書き出しておき、服だけ着せ替える運用も便利です。
  tags: [Blender, Unity, 衣装]
  related: [separate]
  source: discord

- id: blender-vs-unity-fitting
  title: Unity だけで着せるか、Blender を使うかの判断
  reading: ゆにてぃーだけできせるか、ぶれんだーをつかうかのはんだん
  summary: ボディラインが出ない服や対応衣装なら Unity だけで（位置合わせ・拡縮・シェイプキー・Unity 上のメッシュ編集ツール）なんとかなることが多いです。肌に埋まる・体形が大きく違う場合は Blender の方がきれいに仕上がります。
  body: |-
    - **Unity だけで済むことが多い例**
      - 対応衣装、ボディラインの出ないゆったりした服
      - 少しの隙間・はみ出しの修正（Unity 上で頂点を動かせるエディタ拡張を使う方法もあります）
      - 見えない部分の体を消す・細くする（シェイプキーや Unity 上のメッシュ削除ツール）
    - **Blender が向いている例**
      - 衣装が肌に埋まる、体形・姿勢が独特なアバター
      - ウェイトの調整が必要、ボーン位置を個別に合わせたい
    - Blender でのボーン合わせ自体は Unity でやることと大差ありませんが、ボーンが見えて個別調整しやすく、破綻したときに頂点やウェイトをすぐ直せるのが利点です。
    - ウェイトを触らずにボーンだけ個別に動かすと破綻が大きくなるので注意します。
  tags: [Blender, Unity, 衣装]
  related: [weight]
  source: discord

- id: skirt-bones-from-cone
  title: ボーンのないスカートに揺れ用のボーンとウェイトを付ける
  reading: ぼーんのないすかーとにゆれようのぼーんとうぇいとをつける
  summary: スカートの形に近い円錐メッシュを作ってボーンとウェイトを付け、それをスカートにウェイト転送すると確実に揺れ用のウェイトが作れます。
  body: |-
    1. スカートに近い形の円錐メッシュを作り、放射状にスカート用ボーンを配置します（ボーン作成を補助するアドオンもあります）。
    2. 円錐に自動ウェイトなどでウェイトを付け、きれいに整えます。
    3. 円錐からスカートへウェイトを転送します（[ウェイト転送](/howto#copy-weights)）。
    4. Unity で PhysBone を設定します。
    - Cloth で揺れる前提のスカートを VRM などに変換する場合も、この方法でボーンを生やすことになります。
  tags: [Blender, リギング, ウェイト, PhysBone]
  articles: [avatar-clothing/weight-transfer]
  source: discord

- id: weight-check-tools
  title: ウェイトの確認・微調整を楽にする方法
  reading: うぇいとのかくにん・びちょうせいをらくにするほうほう
  summary: ウェイトペイントモードで Ctrl+クリックでボーンを選ぶと、そのボーンのウェイトを確認できます。編集モードでウェイト値を表示する設定や、ちょっとした貫通をスクロールで直せる有料アドオンも便利です。
  body: |-
    - **ボーンごとのウェイト確認**: オブジェクトモードでアーマチュア → `Shift` + メッシュ選択 → ウェイトペイントモード → `Ctrl+クリック` でボーンを選びます。
    - **編集モードで確認**: サイドバー（`N`）の `アイテム > 頂点ウェイト` で、選択頂点のウェイト値を数値で確認・編集できます。
    - **ポーズを付けて確認**: ウェイトペイントモードでもボーンを回転させながら塗れるので、関節の破綻を見ながら直せます。
    - 便利なアドオン（有料）: Handy Weight Edit（スクロールでウェイトを少しずつ変更）など。
    - ウェイトが乗っていない頂点を探す機能を持つ多機能アドオンもあります。
  tags: [Blender, ウェイト]
  shortcuts: [Ctrl+クリック]
  articles: [rigging/weight-paint]
  related: [weight-paint-mode]
  source: discord

- id: hip-assist-bones
  title: お尻・股関節の補助ボーンで座りポーズの破綻を減らす
  reading: おしり・こかんせつのほじょぼーんですわりぽーずのはたんをへらす
  summary: 股関節やお尻に補助ボーンがあると、座る・前かがみになるときのお尻の破綻が大きく減ります。補助ボーンは Humanoid ではないため、Constraint などで動かす仕組みが必要です。
  body: |-
    - 膝・股関節・お尻の補助ボーンは、座りや前かがみの見た目の改善効果が大きい部位です。
    - 補助ボーンは Humanoid に含まれないので、トラッキングでは動きません。Constraint（VRChat では VRC Constraint）で親ボーンの回転を一部受け取るように設定します。
    - 膝を二重関節にして Constraint でつなぐ方法、肘の痩せを防ぐツイストボーンの設定などは外部の記事で紹介されています（[ひざを二重関節と Constraint で修正する](/links#unity-constraint)、[肘関節が痩せるのを防止する TwistBone 設定](/links#twistbone-note)）。
  tags: [Blender, リギング, ウェイト]
  source: discord

- id: gradient-map-recolor
  title: グラデーションマップで元の濃淡を保ったまま色を変える
  reading: ぐらでーしょんまっぷでもとののうたんをたもったままいろをかえる
  summary: CLIP STUDIO PAINT などのグラデーションマップレイヤーを使うと、元テクスチャの明暗をそのままに色だけを置き換えられます。元の色に引っ張られずに色変更できるので、髪やタイツの色変えに向いています。
  body: |-
    1. 色を変えたいレイヤー（髪、タイツなど）の上にグラデーションマップの色調補正レイヤーを追加します。
    2. 目的の色の濃い部分と薄い部分をスポイトで取り、グラデーションに設定します。
    3. 微調整してから書き出します。
    - 色ごとにレイヤーが分かれているテクスチャ向けです。
    - 色相を回すだけより自然になりやすい一方、細部の調整は必要です。
  tags: [マテリアル]
  source: discord

- id: psd-compatibility
  title: PSD を GIMP などで開くとレイヤーが崩れることがある
  reading: ぴーえすでぃーをぎんぷなどでひらくとれいやーがくずれることがある
  summary: PSD は Photoshop 独自の形式で、他のソフトでは一部の機能（調整レイヤーや合成モードなど）が再現されないことがあります。崩れる場合は作者推奨のソフトか、CLIP STUDIO PAINT などで開きます。
  body: |-
    - PSD は汎用フォーマットではなく、Photoshop と CLIP STUDIO PAINT の間でさえ完全には互換しません。
    - GIMP で開いたときにレイヤーが壊れる PSD もあります。色改変を頻繁にするなら CLIP STUDIO PAINT などがあると便利です。
    - 色を少し変えるだけなら、高機能な有料ソフトは割高に感じるかもしれません。まず無料の GIMP で試し、困ったら検討するのがおすすめです。
  tags: [マテリアル]
  source: discord

- id: uv-map-name-unify
  title: メッシュを結合・書き出しする前に UV マップ名を揃える
  reading: めっしゅをけつごう・かきだしするまえにゆーぶいまっぷめいをそろえる
  summary: 異なる UV マップ名のメッシュを結合すると、UV が壊れたり書き出し後にテクスチャが外れたりします。結合前に各メッシュの UV マップ名を同じにしておきます。
  body: |-
    - オブジェクトデータプロパティ（緑の▽）→ `UV マップ` で、最初の UV マップの名前を各メッシュで同じにします（例: すべて `UVMap`）。
    - 結合（`Ctrl+J`）はアクティブオブジェクトの UV マップ名を基準にするため、名前が違うメッシュの UV は別レイヤー扱いになり、見た目が崩れます。
  tags: [Blender, マテリアル]
  articles: [materials/uv-unwrap]
  related: [uv]
  source: discord

- id: animator-layer-priority
  title: FX のレイヤーは下にあるものが優先される（同じプロパティを触る場合）
  reading: えふえっくすのれいやーはしたにあるものがゆうせんされる（おなじぷろぱてぃをさわるばあい）
  summary: Animator のレイヤーは上から順に評価され、同じプロパティを複数のレイヤーが動かすと下のレイヤーの値で上書きされます。リセット用のレイヤーは上に置きます。
  body: |-
    - 例: レイヤー A で OFF にした PhysBone をレイヤー B で ON にしていると、最終的には B（下）の値になります。
    - 「全部リセット」するレイヤーを下に置くと、何をしても変わらなくなります。リセットは上、個別の ON は下に置きます。
    - レイヤー数が多すぎると同期が取りにくくなる点にも注意します。
    - 多数の PhysBone の ON/OFF をアニメーションに書くのが大変なら、PhysBone をまとめて数を減らす（[PhysBone のまとめ方](/tips#physbone-merge-components)）か、スクリプトでアニメーションを生成する方法があります。
  tags: [Unity, アニメーション, PhysBone]
  source: discord

- id: animation-missing-path-f2
  title: AnimationClip のプロパティが (Missing!) になったら F2 で階層を直せる
  reading: あにめーしょんくりっぷのぷろぱてぃが（みっしんぐ）になったらえふつーでかいそうをなおせる
  summary: オブジェクトの名前や階層を変えると、アニメーションのプロパティが (Missing!) になります。Animation ウィンドウで該当プロパティを選び F2 で名前（パス）を編集すると、付け直さずに修正できます。
  body: |-
    1. アバターを選択した状態で Animation ウィンドウを開き、対象のクリップを表示します。
    2. `(Missing!)` になっているプロパティを選択して `F2` を押します。
    3. 新しい階層パス（例: `Armature/Hips/...` やメッシュ名）に書き換えます。
  tags: [Unity, アニメーション]
  shortcuts: [F2]
  source: discord

- id: merge-animation-clips
  title: 2 つの AnimationClip の内容を 1 つにまとめる
  reading: ふたつのあにめーしょんくりっぷのないようをひとつにまとめる
  summary: Animation ウィンドウでコピー元のプロパティ（キー）を選択して Ctrl+C、まとめ先のクリップを開いて Ctrl+V で貼り付けられます。
  body: |-
    - 同じ Animator Controller（同じアバター）で扱えるクリップどうしなら、Animation ウィンドウ上でプロパティのキーフレームを `Ctrl+C` → `Ctrl+V` でコピーできます。
    - 数個程度ならこの方法が手軽です。大量に作るならスクリプトで自動生成した方が楽です。
  tags: [Unity, アニメーション]
  shortcuts: [Ctrl+C, Ctrl+V]
  source: discord

- id: perfect-sync-tips
  title: パーフェクトシンク（52 BlendShape）用シェイプキー作成のコツ
  reading: ぱーふぇくとしんく（ごじゅうにぶれんどしぇいぷ）ようしぇいぷきーさくせいのこつ
  summary: 'BlendShape 名は大文字小文字を区別し、アプリ側の表記（例: BrowInnerUp）と完全に一致させます。トラッキングでは値が 0.3〜0.8 程度にしかならないことが多いので、各シェイプキーは大げさに作っておくと手戻りが少なくなります。'
  body: |-
    - **名前**: 大文字小文字を区別します。参考記事で `browInnerUp` と書かれていても、実際には `BrowInnerUp` でないと動かない場合がありました（使うアプリ・ランタイムのバージョンに合わせます）。
    - **変化量**: iPhone のフェイストラッキングでは各値が 0.3〜0.8 程度にしかならないことが多く、値 1 を基準に作ると思ったより表情が変わりません。目（eye〜）以外は 2〜5 倍程度大げさに作り、やりすぎた分は Unity 側で最大値を下げて調整します。
    - 主に VRM / VMC 系の配信・ゲーム向けの話です。VRChat でもフェイストラッキング用に同様の命名規則（Unified Expressions など）があり、規格ごとに名前が異なります。
  tags: [Blender, リギング, 表情, VRM]
  source: discord

- id: physbone-merge-components
  title: 髪の PhysBone をまとめてコンポーネント数を減らす
  reading: かみのふぃじっくぼーんをまとめてこんぽーねんとすうをへらす
  summary: 前髪・横髪・後ろ髪ごとに空のオブジェクトを作り、各ボーンのルートをその子にまとめて、空オブジェクトに PhysBone を 1 つずつ付けると、コンポーネント数を大幅に減らせます。
  body: |-
    1. 髪のルートボーン（Head など）の下に、前髪・横髪・後ろ髪用の空の GameObject を作ります。
    2. それぞれの髪束のルートボーンを、対応する空オブジェクトの子にします。
    3. 空オブジェクトに PhysBone を付け、Root Transform に空オブジェクトを指定します（揺れは子から反映されるので、空オブジェクト自体は揺れの計算対象外です）。
    - もともと各髪束の PhysBone で根元側のボーンを Root に指定していた場合は、揺れ方が変わるので確認します。
    - スカートはコライダー設定の都合で、髪ほど単純にはまとめられません。
    - PhysBone のコンポーネント数は Performance Rank に影響します。多数の枝がある髪でも 1 つにまとめるとランクが上がることがあります。
    - Blender でボーンのルートを整理し、最初から PhysBone をまとめられる構造にしておくのも有効です。
  tags: [Unity, PhysBone, 軽量化]
  related: [physbone, performance-rank]
  source: discord

- id: collider-v-shape
  title: 細い紐やスカートのボーンが貫通するときは、コライダーを V 字に 2 つ置く
  reading: ほそいひもやすかーとのぼーんがかんつうするときは、こらいだーをぶいじにふたつおく
  summary: ボーン 1 本に対してコライダー 1 つでは、ボーンの動き方によって貫通を防げません。大きめのコライダー 2 つで V 字の谷を作り、その上にボーンが乗るよう配置すると、動ける範囲を制限できます。
  body: |-
    - コライダーの線（境界）は足とボーンの間に来るように置くのが基本です。
    - 絶対に貫通させたくない場合は、大きめのコライダーを 2 つ使って V 字の谷を作り、ボーンをその谷に乗せる配置にします（内側コライダーの代わり）。
    - コライダーが増えると負荷も増えます。VRChat の PhysBone には `Inside` タイプのコライダーもあるので、まずそちらで足りるか検討します。
    - VRM（SpringBone）には Inside コライダーがないため、この方法が特に有効です。
  tags: [Unity, PhysBone, VRM]
  source: discord

- id: breast-physbone-dampen
  title: 胸の PhysBone の揺れが大きすぎるときの抑え方（Constraint を併用）
  reading: むねのふぃじっくぼーんのゆれがおおきすぎるときのおさえかた（こんすとれいんとをへいよう）
  summary: 揺れ方の雰囲気はよいが量が多すぎる場合、同じ構成の空ボーンを揺らし、そこへ元の胸ボーンを Parent Constraint（ソースの重み 0.4 程度）でつなぐと揺れを弱められることがあります。
  body: |-
    1. 胸ボーンと同じ位置・構成の空オブジェクトを作り、そちらに PhysBone を付けて揺らします。
    2. 元の Breast ボーンに Constraint（VRChat では VRC Parent Constraint）を付け、ソースを揺れる空オブジェクトにして重み（Weight）を 0.4 程度にします。
    3. 重みで揺れの量を調整します。
    - 必ずうまくいくとは限らないので、実機で確認しながら調整します。
  tags: [Unity, PhysBone, リギング]
  source: discord

- id: save-playmode-values-prefab
  title: 再生中に調整した値を保存する（再生中にアバターを Project へドラッグ）
  reading: さいせいちゅうにちょうせいしたあたいをほぞんする（さいせいちゅうにあばたーをぷろじぇくとへどらっぐ）
  summary: 再生中に揺れものやコライダーの値を調整した場合、再生中に Hierarchy のアバタールートを Project ウィンドウへドラッグすると、その状態で新しい Prefab が作られます。値をメモして入力し直す手間が省けます。
  body: |-
    1. 再生モードで値を調整します。
    2. 再生中に Hierarchy のアバタールートを Project ウィンドウへドラッグし、新しい Prefab を作ります。
    3. 再生を止めたら、元のアバターを削除（または非表示）し、新しい Prefab を Hierarchy に置きます。
    - コライダーの位置調整などで特に便利です。
  tags: [Unity, PhysBone]
  related: [prefab]
  source: discord

- id: knee-twist-bone-constraint
  title: 膝の二重関節・腕のツイストボーンを Constraint で作る
  reading: ひざのにじゅうかんせつ・うでのついすとぼーんをこんすとれいんとでつくる
  summary: 膝を二重関節にして Constraint でつなぐ方法や、肘が痩せるのを防ぐツイストボーンの設定が外部記事で紹介されています。現在の VRChat では VRC Constraint を使えます。
  body: |-
    - 参考記事: [ひざを二重関節と Constraint で修正する](/links#unity-constraint)、[肘関節が痩せるのを防止する TwistBone 設定](/links#twistbone-note)
    - 膝を二重関節にして Unity の Constraint でつなぐと、膝を曲げたときの形がきれいになります。
    - 腕にツイストボーンを入れると、ひねったときに肘や手首が痩せるのを防げます。費用対効果のバランスがよい改善です。
    - VRChat では 2024 年以降、軽量な **VRC Constraint** が使えます（Unity 標準の Constraint からの変換機能もあります）。
    - VRM 0.x では Constraint が使えません。VRM 1.0 には独自の Constraint があります。Unity の Rotation Constraint はソースのグローバル座標、VRM 1.0 の Rotation Constraint はローカル座標に対する変化で制約する、という違いがあります。
  tags: [Blender, Unity, リギング]
  source: discord

- id: vrm-file-size
  title: VRM のファイルサイズ・負荷を減らす
  reading: ぶいあーるえむのふぁいるさいず・ふかをへらす
  summary: VRM 出力時の Reduce Blendshape を有効にすると、使っていない BlendShape が削られて容量が大きく減ります。ほかにテクスチャサイズを下げる、揺れものとボーンを減らす、FirstPerson を手動設定するのが有効です。
  body: |-
    - **容量**
      - VRM 出力時の `Reduce Blendshape` を有効にします（`Reduce Blendshape Clip` は喜怒哀楽以外の表情クリップも消えるので注意）。
      - 顔のメッシュは他と結合しない（シェイプキーが他のメッシュにも複製されて巨大化します。結合で数百 MB になった例もあります）。
      - テクスチャを 2048 → 1024 にする、使っていないシェイプキーを削除する。
    - **負荷**
      - 揺れもの（SpringBone）とボーンを減らす（衣装とアバターのボーンを入れ子ではなく統合する、使わないスカートボーンを消す）。
      - メッシュをまとめる（VRM では頭を分けたいので 2 つ程度）。ただし必ず軽くなるとは限りません。
      - FirstPerson を Auto ではなく手動で設定する（[FirstPerson 設定](/qa#vrm-firstperson-settings)）。
  tags: [VRM, 軽量化, リギング]
  source: discord

- id: vrm-springbone-center
  title: VRM の SpringBone でゲーム内移動時にスカートが破綻するのを防ぐ（Center の設定）
  reading: ぶいあーるえむのすぷりんぐぼーんでげーむないいどうじにすかーとがはたんするのをふせぐ（せんたーのせってい）
  summary: SpringBone の Center に、アバタールート直下にある Armature 以外のオブジェクト（Secondary など）を入れると、ゲーム内で強制的に移動させられたときの破綻を防げることがあります。
  body: |-
    - SpringBone は通常ワールド座標で計算するため、ゲーム内で急に移動させられるとスカートなどが大きく遅れて破綻します。
    - `Center` に基準となるオブジェクトを入れると、その座標系で計算され移動の影響を受けにくくなります。
    - Center に入れるのは **アバタールート直下のオブジェクト**（Armature 以外）。アバタールートそのものや Armature 配下のボーンでは期待通りに動かず、揺れなくなることもあります。
    - 外部記事「VRMSpringBoneにおけるゲーム内移動時のスカート貫通対策についてのメモ」が参考になります。実機で確認してください。
  tags: [VRM, PhysBone]
  source: discord

- id: beatsaber-customsaber-dynamicbone
  title: Beat Saber のカスタムセイバーで揺れもの（DynamicBone）が揺れない
  reading: びーとせいばーのかすたむせいばーでゆれもの（だいなみっくぼーん）がゆれない
  summary: カスタムセイバー用の DynamicBone は専用版で、コンポーネント追加後に配下の Transform 変更を受け付けません。揺れるオブジェクトを配置し終えてから、DynamicBone を Root のボーンに直接付けます。
  body: |-
    - 専用の DynamicBone を使います。
    - コンポーネントを追加して Root を設定した後は、下の階層の Transform の変更や追加が反映されません。**揺れるオブジェクトを完全に配置し終えてから** 取り付けます。
    - DynamicBone は **Root のボーンに直接** 付けます（親オブジェクトに付けて Root を指定すると揺れなかった事例があります）。
    - Unity 上で納得のいく揺れになっても、ゲーム内では演算の違いで揺れ方が変わることがあります。
  tags: [Unity]
  source: discord

- id: beatsaber-material-change
  title: Beat Saber 用アバターのマテリアル切り替え（MaterialChange 系 MOD）
  reading: びーとせいばーようあばたーのまてりあるきりかえ（まてりあるちぇんじけいもっど）
  summary: VMC / NalulunaAvatars 用の MaterialChange 系 MOD を使うと、VRM でも衣装の切り替えや lilToon 系の見た目を使えます。MOD 用に改造された lilToon を使う場合は、通常版の lilToon と同じプロジェクトに入れないようにします。
  body: |-
    - VMC 用と NalulunaAvatars 用で別の MOD があります（[リンク集](/links#reference)）。
    - MOD 用の lilToon を使うプロジェクトには通常版の lilToon を入れません。入っていたら先に削除してから導入します。
    - 透過（Transparent）どうしの重なりで表示が消える場合は Render Queue を調整します（[透過の描画順](/qa#transparent-render-queue)）。MOD のバージョンによっては不具合のこともあるので、作者に報告します。
    - 一部の特殊なシェーダー設定（2 パス半透明など）には対応していない場合があります。
  tags: [Unity, VRM, マテリアル]
  source: discord

- id: unity-scene-view-navigation
  title: Unity の Scene ビューで視点を動かす・拡大する
  reading: ゆにてぃーのしーんびゅーでしてんをうごかす・かくだいする
  summary: マウスホイールで拡大縮小、Alt + 左ドラッグで視点の回転、中ボタン（ホイール）ドラッグで平行移動、Hierarchy でオブジェクトを選んで F キーでそのオブジェクトにフォーカスします。
  body: |-
    | 操作 | 方法 |
    |---|---|
    | 拡大・縮小 | マウスホイール |
    | 視点の回転（周回） | Alt + 左ドラッグ |
    | その場で見回す | 右ボタンドラッグ |
    | 平行移動 | 中ボタン（ホイール）ドラッグ |
    | 選択物にフォーカス | Hierarchy で選択して `F`（Scene ビュー上で） |
    | 飛行移動 | 右ボタンを押しながら `W` `A` `S` `D` |
    - 髪の毛だけアップで見たい場合は、Hierarchy で髪のオブジェクトを選んで `F` を押すと便利です。
    - 表示がおかしくなったら `Window > Layouts` からレイアウトを選び直すと初期配置に戻せます。
  tags: [Unity]
  shortcuts: [F]
  articles: [unity/editor-overview]
  related: [scene-view]
  source: discord

- id: continuous-avatar-uploader
  title: 複数のアバター（衣装違い）をまとめて連続アップロードする
  reading: ふくすうのあばたー（いしょうちがい）をまとめてれんぞくあっぷろーどする
  summary: Continuous Avatar Uploader を使うと、設定ファイルに登録した複数のアバターを自動で順番にアップロードできます。素体が更新されて全衣装をアップし直すときに便利です。
  body: |-
    1. `Assets > Create > Avatar Upload Setting Group` で設定ファイルを作ります。
    2. アップロードしたいアバター（VRC Avatar Descriptor の付いたオブジェクト）をドラッグして `Add Avatar` を押し、対象プラットフォームやオプションを設定します。
    3. `Tools > Continuous Avatar Uploader` でウィンドウを開き、Groups に設定ファイルをセットします。
    4. `Start Upload` を押すと順番にアップロードされます。
    - 同じ作者の Avatar Optimizer（AAO）も軽量化に便利です。
  tags: [Unity, VRChat]
  source: discord

- id: blender-addons-for-avatar
  title: アバター改変でよく使われる Blender アドオン
  reading: あばたーかいへんでよくつかわれるぶれんだーあどおん
  summary: LoopTools（ループ整形）、シェイプキー付きメッシュにモディファイアーを適用するアドオン、ウェイト調整系のアドオンなどがよく使われます。CATS は本家の更新が止まっているため、Blender 4.5 では対応状況を確認してください。
  body: |-
    | アドオン | 用途 | 備考 |
    |---|---|---|
    | LoopTools | 辺ループを円形・均等に整える | Blender 4.2 以降は Extensions から導入 |
    | ApplyModifier（など） | シェイプキー付きメッシュにモディファイアーを適用 | 同種の他アドオンもあります |
    | Handy Weight Edit | スクロールでウェイトを少しずつ調整 | 有料 |
    | Better FBX Importer & Exporter | FBX の入出力 | 有料。設定に注意（[法線](/qa#better-fbx-exporter-normals)） |
    | RestoreSymmetry | 左右対称の復元 | 古いアドオン。fork あり |
    | CATS Blender Plugin | 当時の定番（最適化、ポーズのレストポーズ適用、Decimation など） | 本家は更新停止。2.9 以降で不具合報告あり。後継の Unofficial 版の対応バージョンを確認 |
    - 配布先は [アドオン](/addons) のページにまとめています。
    - アドオンは対応している Blender のバージョンが決まっているので、Blender を更新する前に確認します。
    - どのアドオンを入れていたか忘れないよう、メモしておくと移行が楽です。
  tags: [Blender]
  source: discord
