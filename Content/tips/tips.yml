# TIPS: よくあるつまずきと直し方。/tips に表示され、検索の対象になる。
#
#   id:      URL のアンカー（/tips#id）
#   title:   短い見出し（症状や原因がひと目でわかるように）
#   symptom: 症状（Markdown）
#   cause:   原因（Markdown）
#   fix:     直し方（Markdown。手順は箇条書き）
#   tags / shortcuts / articles / source（manual / discord）は用語集と同じ
#
# 対象: Blender 4.5 / Unity 2022.3 + VRChat SDK3 + Modular Avatar

- id: unapplied-scale
  title: スケールを適用していない
  reading: すけーるをてきようしていない
  symptom: ソリッド化の厚みやベベルの幅が軸ごとに違う。Unity に入れると大きさが 100 倍・0.01 倍になる。
  cause: オブジェクトモードで拡大縮小すると、メッシュではなくオブジェクトの「スケール」の値が変わる。モディファイアーや書き出しはその値の影響を受ける。
  fix: |
    - オブジェクトを選んで <kbd>Ctrl</kbd>+<kbd>A</kbd> > **スケール**（書き出し前は **全トランスフォーム**）
    - サイドバー（<kbd>N</kbd>）でスケールが 1.000 になっていることを確かめる
    - アーマチュアで動かしているメッシュは、アーマチュアと一緒に適用する
  tags: [Blender, 書き出し, モデリング]
  shortcuts: [Ctrl+A, N]
  articles: [basics/transform, avatar-clothing/export-fbx]
  related: [apply-transform]
  keywords: [Ctrl+A]
  body: |-
    **アバターと服を結合（Ctrl+J）したら大きさが変わった**

    アーマチュアやメッシュのスケールが 1 になっていないと、結合時に片方の大きさが変わります。結合前にそれぞれ Ctrl+A → 全トランスフォームを適用してスケールを 1 にします。

    1. `N` でサイドバーを開き、アバターと服それぞれのアーマチュア（とメッシュ）のスケールが `1` か確認します。
    2. 1 でないものを選択し、`Ctrl+A` → **全トランスフォーム** を適用します。見た目はそのままでスケールが 1 になります。
    3. 両方が 1 になった状態で結合します。
    - メッシュ結合で「衣装が素体に対して大きく表示される」場合も同じく適用漏れが原因です。
    - FBX の読み込み直後はアーマチュアに 0.01 などのスケールが付いていることがあります。
  source: discord

- id: flipped-normals
  title: 面が黒い・Unity で一部が透けて見えない
  reading: めんがくろい・ゆにてぃーでいちぶがすけてみえない
  symptom: マテリアルプレビューで一部の面が黒い。Unity では、その面が裏からしか見えない（透明に見える）。
  cause: 面の表裏（法線）が裏返っている。ミラーや押し出しのあとに起きやすい。
  fix: |
    - 3D ビューの「オーバーレイ > 面の向き」で確認する（表が青、裏が赤）
    - 編集モードで <kbd>A</kbd> → <kbd>Shift</kbd>+<kbd>N</kbd>（面の向きを外側に揃える）
    - 直らない面だけ選んで「メッシュ > ノーマル > 反転」
  tags: [Blender, Unity, モデリング]
  shortcuts: [Shift+N, A]
  articles: [modeling/topology]

- id: duplicate-vertices-tip
  title: スムーズにすると黒い筋が出る
  reading: すむーずにするとくろいすじがでる
  symptom: スムーズシェードにすると線状の影や筋が出る。自動ウェイトが失敗する。
  cause: 同じ位置に頂点が重なっている（押し出しのキャンセル、ミラーの中央、統合のあとなど）。
  fix: |
    - 編集モードで <kbd>A</kbd> → <kbd>M</kbd> > **距離で**
    - 画面左下に「○個の頂点を削除」と出る。消えた数が 0 なら別の原因（法線の裏返りなど）
  tags: [Blender, モデリング]
  shortcuts: [M, A]
  articles: [modeling/topology, modeling/bevel-knife-merge]

- id: pink-material
  title: Unity でマテリアルがピンク（マゼンタ）になる
  reading: ゆにてぃーでまてりあるがぴんく（まぜんた）になる
  symptom: アバターや衣装を入れたら、表面が真っピンクになる。
  cause: マテリアルが使うシェーダーがプロジェクトに無い。衣装が lilToon などを前提にしているのに、プロジェクトに入っていないことが多い。
  fix: |
    - 衣装の説明で、必要なシェーダー（lilToon など）とバージョンを確かめる
    - VCC / ALCOM のパッケージ、または配布元の unitypackage でシェーダーを入れる
    - 入れたあとも直らなければ、マテリアルの Inspector でシェーダーを選び直す
  tags: [Unity, マテリアル]
  articles: [materials/for-unity]
  related: [shader]
  keywords: [Reimport, UTS2]
  body: |-
    **アバターや衣装がピンク色（マゼンタ）で表示されるのはなぜですか？**

    マテリアルが参照しているシェーダーがプロジェクトに入っていないか、読み込みに失敗しています。作者が指定するシェーダーを導入し、直らなければシェーダーを Reimport します。

    - ピンク色は「シェーダーが見つからない／コンパイルできない」状態です。
    - 対処
      1. アバター・衣装の説明書で指定されているシェーダー（lilToon、UTS2、Poiyomi など）を導入します。
      2. 導入後も直らない場合は、該当シェーダーのフォルダを右クリック → `Reimport` を試します。
      3. それでも駄目ならアバターのアセットを一度削除し、シェーダー → アバターの順にインポートし直します。
    - マテリアルを選択し、Inspector 上部の `Shader` 欄が正しいシェーダーになっているかも確認します。
    - VRM（MToon）向けの書き出しで MToon 以外のシェーダーを使うと、Standard シェーダー扱いになり金属のような見た目になることがあります（[VRM の MToon 変換](/qa#vrm-mtoon-conversion)）。
  source: discord

- id: ma-bone-mismatch
  title: Modular Avatar で服が体についてこない
  reading: もじゅらーあばたーでふくがからだについてこない
  symptom: Setup Outfit をしたのに、アバターが動くと服がその場に残る・ずれる。
  cause: 衣装のボーン名がアバターのボーン名と合っていない（別のアバター向けの衣装、名前の前後に余計な文字があるなど）。Setup Outfit が衣装のアーマチュアを見つけられていないこともある。
  fix: |
    - 衣装がそのアバターに対応しているか確かめる（対応アバター以外は、ボーンの調整が必要）
    - 衣装のアーマチュアに **MA Merge Armature** が付いているか、Merge Target がアバターの Armature か確かめる
    - 名前の前後の違いは、MA Merge Armature の Prefix / Suffix で合わせる
    - Build & Test で実際に動かして確かめる
  tags: [Unity, Modular Avatar, リギング]
  articles: [avatar-clothing/unity-setup]

- id: clothes-clip-through
  title: 体が服を突き抜ける
  reading: からだがふくをつきぬける
  symptom: 腕を曲げたりしゃがんだりすると、体が服の外に出てくる。
  cause: 服と体のウェイトが合っていない、または服が体に近すぎる。
  fix: |
    - 服のウェイトを体から転送し直す（データ転送）
    - 服を少しだけ外に膨らませる（編集モードで <kbd>Alt</kbd>+<kbd>S</kbd>）
    - 服で隠れる部分の体は、シェイプキーで縮めるか、服の下の体のメッシュを消す
  tags: [Blender, ウェイト, Unity]
  shortcuts: [Alt+S]
  articles: [avatar-clothing/weight-transfer]
  related: [shape-key]
  keywords: [DietShaper, メッシュ削除]
  body: |-
    **衣装から肌が突き抜ける（貫通する）ときの対策**

    主な対策は、①見えない素体メッシュを消す、②素体を細くするシェイプキーを作る、③衣装を少し膨らませる、④素体と衣装の頂点数・位置を揃える、⑤ウェイトを揃える、です。関節まわりが特に貫通しやすいです。

    **原因**

    - 素体と衣装の頂点の数・位置が違うと、曲げたときにどちらかがはみ出します（頂点が少ない側が内側の頂点を突き抜けやすい）。
    - 素体と衣装でウェイトや関節位置が違う。

    **対策**

    1. **素体メッシュを消す**: 衣装で隠れる部分なら一番確実です。メッシュが分かれていれば軽量化にもなります。
    2. **素体を細くするシェイプキー**: 消すのが不安なら、肩・肘・膝・脚の付け根など関節まわりや脇の下を細くするシェイプキーを作り、衣装に合わせて値を入れます。Unity 側で調整できるので、非対応衣装も Unity だけで済む場合があります。
    3. **衣装を少し膨らませる**: 貫通箇所だけ外側に出します。
    4. **頂点数・位置を揃える**: 貫通箇所を細分化してポリゴンを増やす、など。
    5. **ウェイトを揃える**: 素体からウェイトを転送します（[ウェイト転送](/howto#copy-weights)）。体のウェイトが入り組んだ箇所（Spine と Chest の境目など）は、捻ると貫通しやすくなります。
    6. **素体に衣装と同じ色を塗る**: テクスチャ側でごまかす方法もあります。
    - Unity だけで行う場合は、体を細くするシェイプキーを自動作成するエディタ拡張（DietShaper など）も使えます。
    - 何枚も重なった衣装で肌が見えない部分は、貫通防止用のシェイプキーでまとめて絞るのが現実的です。
  source: discord

- id: fbx-leaf-bones
  title: Unity で余計なボーン（_end）が増えている
  reading: ゆにてぃーでよけいなぼーん（えんど）がふえている
  symptom: 書き出した FBX を Unity に入れると、ボーンの先に「〜_end」というボーンが増えている。
  cause: FBX 書き出しの「リーフボーン追加」（Add Leaf Bones）がオンになっている。
  fix: |
    - FBX の書き出しで、アーマチュアの **リーフボーン追加** をオフにする
    - あわせて「選択したオブジェクト」で、服とアーマチュアだけを書き出す
  tags: [Blender, Unity, 書き出し]
  articles: [avatar-clothing/export-fbx]

- id: fbx-rotation
  title: Unity で服が 90° 回っている・寝ている
  reading: ゆにてぃーでふくが90どまわっている・ねている
  symptom: FBX を Unity に置くと、横倒しになっている。Rotation に -90 などの値が入っている。
  cause: Blender（Z が上）と Unity（Y が上）の軸の違いが、オブジェクトの回転として残っている。
  fix: |
    - 書き出す前に <kbd>Ctrl</kbd>+<kbd>A</kbd> > 全トランスフォーム を適用する
    - FBX 書き出しの「トランスフォーム」の前方 -Z・上 Y（既定値）を変えていないか確かめる（衣装の配布元の推奨設定があればそれに従う）
    - 同じ欄の「トランスフォームを適用」は実験的な機能で、アーマチュアでは正しく動かないことがわかっているので、アバターでは使わない
  tags: [Blender, Unity, 書き出し]
  shortcuts: [Ctrl+A]
  articles: [avatar-clothing/export-fbx]
  keywords: [座標系, Rotation, FBX エクスポート]
  body: |-
    **Blender で合わせた服やアクセサリーが Unity では傾く・向きが変わる**

    Blender（Z 上）と Unity（Y 上）の座標系の違いで、FBX 読み込み後に Rotation X が -89.98 のようなわずかにずれた値になることがあります。Blender 側で回転を整えて書き出し、Unity で Rotation が (0, 0, 0) になるようにします。

    - 通常は FBX エクスポーター／インポーターが自動で変換するので、普段は気にしなくて大丈夫です。おかしくなったときだけ対処します（揺れものの動きがおかしくなる形で表れることもあります）。
    - **シェイプキーのないメッシュの場合**（概要）
      1. `Shift+S` → カーソルをワールド原点へ。ピボットポイント（`.`）を 3D カーソルにします。
      2. 全オブジェクトを X 軸に -90° 回転 → 回転を適用 → X 軸に +90° 回転（適用しない）、の手順で、Blender 上の Rotation X が 90 の状態にします。
      3. FBX を書き出し、Unity で Rig の向きや Rotation が (0, 0, 0) になっているか確認します。
    - **シェイプキーのあるメッシュの場合**: メッシュを固定したまま座標軸だけを回転させる方法を使います（オブジェクトモードで実行）。
    - 詳しい手順は外部記事「BlenderとUnityの座標系の違いを治す」を参照してください。
    - Maya 製のアバターなどは、Blender を通すとスケールが 100 倍になる・回転値が残るなどの差が出ることがあります。
  source: discord

- id: bone-heat-failed
  title: 自動のウェイトで「Bone Heat Weighting」エラーが出る
  reading: じどうのうぇいとで「ぼーんひーとうぇいてぃんぐ」えらーがでる
  symptom: '<kbd>Ctrl</kbd>+<kbd>P</kbd> > 自動のウェイトで、「Bone Heat Weighting: failed to find solution for one or more bones」と出て、一部の頂点が動かない。'
  cause: 重複頂点、とても小さい・薄い部分、つながっていないパーツ、スケールの大きすぎる / 小さすぎるメッシュなど。
  fix: |
    - <kbd>M</kbd> > 距離で 重複頂点を消す
    - スケールを適用する（<kbd>Ctrl</kbd>+<kbd>A</kbd>）
    - 服なら、自動ではなく体からのウェイト転送（データ転送）を使う
  tags: [Blender, ウェイト, リギング]
  shortcuts: [Ctrl+P, M, Ctrl+A]
  articles: [rigging/parent-weights, avatar-clothing/weight-transfer]

- id: shape-key-modifier
  title: シェイプキーがあるとモディファイアーを適用できない
  reading: しぇいぷきーがあるともでぃふぁいあーをてきようできない
  symptom: モディファイアーの「適用」で「Modifier cannot be applied to a mesh with shape keys」と出る。
  cause: Blender は、シェイプキーを持つメッシュへのモディファイアーの適用を（そのままでは）できない。
  fix: |
    - シェイプキーを作る前に、ミラーなどのモディファイアーを適用しておく（作業の順番で避ける）
    - すでにシェイプキーがある場合は、シェイプキーを保ったまま適用するアドオンを使う。FBX 書き出しの「モディファイアーを適用」をオンにすると、シェイプキーが書き出されなくなるので代わりにはならない
  tags: [Blender, リギング, モデリング]
  articles: [rigging/shape-keys, basics/modifiers]
  keywords: [ApplyModifier, Transfer Weights, Basis]
  body: |-
    **シェイプキーがあるメッシュにモディファイアーを適用できない**

    Blender の仕様で、シェイプキーを持つメッシュには通常モディファイアーを適用できません。シェイプキーを Basis に反映して削除するか、シェイプキーを保ったまま適用できるアドオンを使います。ウェイトだけならウェイトペイントモードの「ウェイトを転送」で適用不要にできます。

    - 選択肢
      1. **シェイプキーを使っていない** → 削除してから適用します。
      2. **シェイプキーで形を調整していた** → 必要な形を Basis に反映してから全シェイプキーを削除し、適用します。
      3. **シェイプキーを残したい** → シェイプキー付きメッシュにモディファイアーを適用できるアドオン（ApplyModifier など）を使います。
    - **ウェイト転送が目的なら**: モディファイアーを使わず、ウェイトペイントモードの `ウェイト > ウェイトを転送（Transfer Weights）` を使うと、シェイプキーがあってもそのまま転送できます。
    - Armature モディファイアーは **適用せずに残しておく** ものです（[服が動かない](/qa#clothes-not-following-bones)）。
  source: discord

- id: shape-keys-lost
  title: Unity でシェイプキー（ブレンドシェイプ）が出ない
  reading: ゆにてぃーでしぇいぷきー（ぶれんどしぇいぷ）がでない
  symptom: Blender で作ったシェイプキーが、Unity の Skinned Mesh Renderer の BlendShapes に出てこない。
  cause: FBX 書き出しの「モディファイアーを適用」がオンになっていて、シェイプキーが書き出されていない。
  fix: |
    - FBX 書き出しの **ジオメトリ > モディファイアーを適用** をオフにして書き出し直す（オンだとシェイプキーが書き出されない）
    - 書き出し前に、メッシュにシェイプキーが残っているか（プロパティ > データ > シェイプキー）確かめる
    - Unity 側で FBX の Import Settings > Model > **Import BlendShapes** がオンか確かめる
  tags: [Blender, Unity, 書き出し]
  articles: [rigging/shape-keys, avatar-clothing/export-fbx]

- id: mirror-center-gap
  title: ミラーの真ん中が開く・重なる
  reading: みらーのまんなかがひらく・かさなる
  symptom: ミラーで作った形の中央に、すき間や段差ができる。
  cause: 中央の頂点が X = 0 からずれている。クリッピング・マージがオフになっている。
  fix: |
    - ミラー モディファイアーの **クリッピング** と **マージ** をオンにする
    - 中央の頂点を選んで <kbd>S</kbd> → <kbd>X</kbd> → `0` → <kbd>Enter</kbd> で X = 0 にそろえる
  tags: [Blender, モデリング]
  shortcuts: [S]
  articles: [modeling/mirror-smooth]

- id: weights-not-normalized
  title: 動かすと、関係ないところまで引っ張られる
  reading: うごかすと、かんけいないところまでひっぱられる
  symptom: 腕を上げると脇腹やスカートまで一緒に動く。
  cause: 関係ないボーンにもウェイトが少し付いている、またはウェイトの合計が 1 になっていない。
  fix: |
    - ウェイトペイントで、引っ張られている頂点に付いているボーン（頂点グループ）を確かめる
    - 「ウェイト > すべてを正規化」で合計を 1 にそろえる
    - 小さすぎるウェイトは「ウェイト > クリーン」で消す
  tags: [Blender, ウェイト]
  articles: [rigging/weight-paint]

- id: unity-version
  title: Unity のバージョンが違うと言われる
  reading: ゆにてぃーのばーじょんがちがうといわれる
  symptom: VCC / ALCOM でプロジェクトを開くと、Unity のバージョンが違う・見つからないと表示される。SDK が入らない。
  cause: VRChat が対応している Unity のバージョン（2026 年 10 月時点は 2022.3.22f1）以外で開いている。
  fix: |
    - VCC / ALCOM が案内する Unity のバージョンを、Unity Hub から入れる
    - 新しいプロジェクトは VCC / ALCOM から作る（Unity Hub から直接作らない）
  tags: [Unity, VRChat]
  articles: [avatar-clothing/unity-setup]
  related: [vcc]
  keywords: [Unity Hub, SDK 更新]
  body: |-
    **VRChat から Unity のバージョンを上げるよう言われたら**

    VRChat が指定するパッチバージョンに上げ、合わせて VRChat SDK も更新します。同じマイナー系列（例: 2022.3.x）内の更新ならプロジェクトはそのまま移行できることが多いです。ただし、事前にバックアップを取ります。

    - VCC / ALCOM や Unity Hub から、指定されたバージョンの Unity をインストールし、プロジェクトのバージョンを切り替えます。
    - Unity を上げたら VRChat SDK も最新に更新します。
    - 当時の事例: 2022.3.6f1 → 2022.3.22f1 への移行はそのまま開け（初回起動は時間がかかる）、FBX のフレームレートに関する警告が出た程度でアップロードできました。
    - 大きくバージョンが変わる場合（メジャー更新）は、新しいプロジェクトを作って移行する方が安全なこともあります。
    - VRChat が指定するより新しい Unity（Unity 6 など）でアップロードしたものは、VRChat で読み込めません。VRChat の案内が出るまでは上げないでください。
  source: discord

- id: cannot-upload
  title: Build & Publish のボタンが押せない
  reading: びるどあんどぱぶりっしゅのぼたんがおせない
  symptom: SDK の Builder でアップロードのボタンが灰色、または赤いエラーが並んでいる。
  cause: VRC Avatar Descriptor が無い、Humanoid でない、ログインしていない、権利の確認にチェックしていない、などの検査エラー。
  fix: |
    - Builder の一覧の赤いエラーを上から読む。「Auto Fix」があるものは押す
    - アバターのルートに VRC Avatar Descriptor が付いているか、FBX の Rig が Humanoid か確かめる
    - Authentication タブでログインしているか確かめる
    - アップロードできるのはトラストランクが New User 以上のアカウント（Visitor は Build & Test だけ使える）
  tags: [VRChat, Unity]

- id: overwrote-avatar
  title: 別のアバターに上書きしてしまった
  reading: べつのあばたーにうわがきしてしまった
  symptom: 新しく作ったアバターをアップロードしたら、前のアバターが置き換わった。
  cause: 前のアバターから複製したため、Pipeline Manager の Blueprint ID が同じまま。
  fix: |
    - アップロード前に、アバターの Pipeline Manager で **Detach** して Blueprint ID を外す
    - 上書きしてしまったら、前のアバターのプロジェクトから同じ Blueprint ID でアップロードし直して戻す
    - Blueprint ID は SDK の Content Manager タブでも確かめられる
  tags: [VRChat]

- id: very-poor
  title: パフォーマンスランクが Very Poor になる
  reading: ぱふぉーまんすらんくがべりーぷあーになる
  symptom: Builder でアバターのランクが Very Poor になり、ほかの人から見えにくくなる。
  cause: 三角形の数・マテリアル数・Skinned Mesh の数・PhysBone の数などのどれかが上限を超えている。いちばん悪い項目がランクになる。
  fix: |
    - Builder のランクの詳細で、どの項目が悪いかを見る
    - 見えない面を消す、服の下の体を消す、マテリアルをまとめる（同じテクスチャにまとめる）
    - 使わない衣装やギミックは、無効にするのではなく Tag を EditorOnly にするか削除する
  tags: [VRChat, モデリング]
  articles: [modeling/topology, vrchat/optimization]
  related: [performance-rank]
  keywords: [Very Poor, Avatar Optimizer]
  body: |-
    **パフォーマンスランクが Very Poor になるのは普通ですか？**

    最近の販売アバターは衣装切り替えなどを含むと Very Poor になることが多いです。ポリゴン数・メッシュ数・マテリアルスロット数・PhysBone 数などで決まるので、人の多い場所用に軽い版を用意すると親切です。

    - ランクは複数の項目のうち最も悪い項目で決まります（ポリゴン数、Skinned Mesh 数、マテリアルスロット数、PhysBone のコンポーネント数・Transform 数・コライダー数など）。
    - マテリアル数は「実際に使っているマテリアルの種類」ではなく **スロット数** で数えられます。
    - 衣装を複数入れて切り替えると、非表示のメッシュもカウントされてすぐ上限を超えます。
    - 目安として、集会など人の多い場所に行くときは衣装 1 着だけの軽量版アバターを別に用意する方法があります。
    - 各ランクの具体的な上限値は VRChat 公式の「Avatar Performance Ranking System」ページで確認してください（PC/Android で異なります）。PC では Very Poor でもアップロード・表示はできますが、Android（Quest など）では Very Poor のアバターは表示されません。
    - Cloth コンポーネントは評価が厳しく、すぐ Very Poor になります。
    - 詳しい手順は [アバターの軽量化](/qa#avatar-lightweight) を参照してください。
  source: discord

- id: texture-too-large
  title: アバターのダウンロードサイズが大きい
  reading: あばたーのだうんろーどさいずがおおきい
  symptom: アップロードはできるが、ダウンロードサイズ（容量）が大きい。
  cause: テクスチャの解像度が必要以上に大きい（4096 など）、圧縮されていない。
  fix: |
    - Project ウィンドウでテクスチャを選び、Inspector の **Max Size** を 2048 や 1024 に下げる
    - Compression を Normal Quality 以上の圧縮にする（目立つ顔などは様子を見ながら）
  tags: [Unity, VRChat, マテリアル]
  articles: [materials/for-unity]

- id: physbone-not-swinging
  title: PhysBone が揺れない・揺れすぎる
  reading: ふぃじっくぼーんがゆれない・ゆれすぎる
  symptom: 髪やスカートがまったく揺れない、または暴れる。
  cause: Root Transform が揺らしたいボーンの根元になっていない、Pull と Spring のバランスが極端、Ignore Transforms に揺らすボーンが入っている。
  fix: |
    - VRC Phys Bone の Root Transform に、揺らしたいボーンの根元を指定する
    - Pull（戻る力）を 0.2〜0.4、Spring（揺れ）を 0.2 前後から調整する
    - Build & Test で実際に動かして確かめる
  tags: [VRChat, Unity]

- id: original-clothes-show
  title: 元の服と新しい服が重なって表示される
  reading: もとのふくとあたらしいふくがかさなってひょうじされる
  symptom: 衣装を着せたのに、アバターの初期衣装が服から突き出している。
  cause: アバターの元の服（または、服の下の体）が表示されたまま。
  fix: |
    - Hierarchy でアバターの元の服のメッシュを選び、Inspector 左上のチェックを外す
    - 完全に外すなら Tag を EditorOnly にする（アップロードに含めない）
    - 服の下で体が突き抜けるなら、アバターの体の「縮める」シェイプキーを MA の設定や Skinned Mesh Renderer で使う
  tags: [Unity, Modular Avatar]
  articles: [avatar-clothing/unity-setup]

- id: added-at-wrong-place
  title: 追加したオブジェクトが変なところに出る
  reading: ついかしたおぶじぇくとがへんなところにでる
  symptom: <kbd>Shift</kbd>+<kbd>A</kbd> で追加したものが、見えない場所や遠くに出る。
  cause: 新しいオブジェクトは 3D カーソルの位置に追加される。カーソルが動いている。
  fix: |
    - <kbd>Shift</kbd>+<kbd>S</kbd> > カーソル → ワールド原点 で戻してから追加する
    - すでに追加したものは <kbd>Alt</kbd>+<kbd>G</kbd> で位置をリセット
  tags: [Blender]
  shortcuts: [Shift+S, Shift+A]
  articles: [basics/select, basics/origin-pivot-snap]

# ---------------------------------------------------------------- Discord の改変相談から

- id: fbx-import-settings-unity
  title: Blender から書き出した FBX を Unity に入れたら確認する設定
  reading: ぶれんだーからかきだしたえふびーえっくすをゆにてぃーにいれたらかくにんするせってい
  summary: アバターごと書き出した FBX は Rig を Humanoid にし、Blend Shape Normals を None にします。Humanoid にしたら Configure でボーンの割り当てと向きも確認します。
  body: |-
    - FBX を選択して Inspector で次を設定し `Apply` します。
      - `Model` タブ: **Blend Shape Normals を None**（シェイプキー使用時の陰影の乱れを防ぎます）
      - `Rig` タブ: **Animation Type を Humanoid**
    - `Rig` タブの `Configure...` で、各 Humanoid ボーン（Hips、Spine、Chest、Upper Chest など）が正しく割り当てられているか、体の向きが正しいかを確認します。
    - 衣装単体の FBX は、Modular Avatar で着せる場合はアバターと同じ設定でなくても動作しますが、作者の指定があればそれに従います。
  tags: [Blender, Unity, リギング]
  articles: [avatar-clothing/export-fbx]
  related: [humanoid]
  source: discord

- id: unitypackage-fbx
  title: unitypackage 内の FBX を使う・取り出す
  reading: あんにてぃーぱっけーじないのえふびーえっくすをつかう・とりだす
  summary: Blender で編集するときは、unitypackage をインポートしたときに Assets に入る FBX を使うのが確実です。Project ウィンドウで右クリック → Show in Explorer でファイルの場所を開けます。
  body: |-
    - ZIP に同梱されている FBX と unitypackage 内の FBX が異なる（更新漏れ）ことがあります。**Unity で実際に使われるのは unitypackage 内のモデル** なので、編集元にはそちらを使うのが安全です。
    - 取り出し方: Project ウィンドウで FBX を右クリック → `Show in Explorer`（Windows ではエクスプローラーで表示）。
    - 編集した FBX で上書きするときは、Unity にドラッグ＆ドロップすると別名ファイルができます。上書きしたい場合はエクスプローラーで上書きするか、同名ファイルを上書きできるエディタ拡張（unity-overwriter）を使います。
    - 一部のアバターは、FBX を Blender で編集すると足の位置などがずれる仕様のものもあります。作者の説明を確認してください。
  tags: [Blender, Unity, 衣装]
  source: discord

- id: unity-project-organization
  title: Unity プロジェクトの分け方（アバター単位・シーン単位）
  reading: ゆにてぃーぷろじぇくとのわけかた（あばたーたんい・しーんたんい）
  summary: プロジェクトはアバターごと（または VRChat 用・VRM 用）に分け、衣装ごとにシーンや Prefab を分けて管理する方法がよく使われます。
  body: |-
    - 例 1: VRChat 用と VRM 用でプロジェクトを 1 つずつ作り、衣装ごとにシーンを作る。
    - 例 2: アバターごとにプロジェクトを作り、素体の Prefab を用意しておき、衣装ごとにシーンや Prefab を保存する。
    - 着せ終わったアバターは Prefab 化して Hierarchy から消しておくと、シーンが重くなりません。
    - 素体が大きく更新されて互換性がなくなったら、新しいプロジェクトに作り直すのも手です。
    - 衣装ごとにプロジェクトを作るとディスク容量が大きくなりがちです。共通で使うアニメーションやマテリアルは unitypackage に書き出しておくと移行が楽です。
    - シーンは保存し忘れやすいので、切り替え前に `Ctrl+S` で保存しましょう。
  tags: [Unity, 衣装]
  related: [scene-view, prefab]
  source: discord

- id: check-license-terms
  title: 改変・非対応衣装を着せる前に利用規約を確認する
  reading: かいへん・ひたいおういしょうをきせるまえにりようきやくをかくにんする
  summary: 改変や他アバター向けの調整、ウェイト転送などの可否は商品ごとの規約で決まります。「禁止と書いていない」ではなく「許可されている」ことを確認するのが安全です。
  body: |-
    - 確認するポイント（VN3 ライセンスなどの項目）
      - 調整・改変の可否
      - 他のデータを改変するための利用（他アバターの素体からのウェイト転送など）
      - 配信・動画での利用、営利利用の可否
    - 書かれていない項目は「不可」として扱う方が無難です。
    - 専売衣装（特定ショップ向け）でも、規約で改変が許可されていれば自分で他アバターに合わせるのは問題ない場合があります。
    - 素体からのウェイト転送は「素体データを他の衣装に流用」する行為になるので、規約で許可されているか確認してからにします。
    - 規約は途中で変わることもあります。購入時点の規約を保存しておくと安心です。
    - 配信・動画での利用は個別許可制の衣装もあります。
  tags: [規約, 衣装]
  source: discord

- id: booth-author-bug-report
  title: BOOTH の衣装に不具合（貫通など）があったときの作者への連絡
  reading: ぶーすのいしょうにふぐあい（かんつうなど）があったときのさくしゃへのれんらく
  summary: まず説明書やシェイプキーの指定（体を絞る前提など）を確認し、素の状態で着せて再現することを確かめてから、質問の形で丁寧に問い合わせると行き違いが少なくなります。
  body: |-
    1. 説明書・商品ページで「素体のシェイプキーを絞る前提」などの指定がないか確認します。
    2. 自分の改変ではなく、素の状態（作者指定の手順）で着せて再現するか確認します。
    3. 連絡する場合は「○○の素体にそのまま着せると××が貫通するのですが、シェイプキーで絞る前提でしょうか？」のように、断定ではなく質問として伝えます。
    - 作者が気づいていないだけ・手違いのこともあるので、伝えること自体は有益です。
  tags: [規約, 衣装]
  source: discord

- id: editor-only-tag
  title: アップロードしたくないオブジェクトには EditorOnly タグを付ける
  reading: あっぷろーどしたくないおぶじぇくとにはえでぃたーおんりーたぐをつける
  summary: VRChat では非アクティブなオブジェクトもアップロードされます。作業用・退避用のオブジェクトはアバターの外に出すか、Tag を EditorOnly にするとビルド時に除外されます。
  body: |-
    - 非表示（非アクティブ）にしただけでは VRChat にアップロードされ、容量・負荷が増えます。
    - 対処: アバターの外に出す、削除する、または Inspector の `Tag` を **EditorOnly** にします。
    - 元アバターの Prefab Variant で作業していて削除できない要素がある場合に、EditorOnly が便利です。
    - VRM 出力では非表示のオブジェクトは出力されません。
  tags: [Unity, VRChat, 軽量化]
  articles: [unity/pre-upload-check]
  source: discord

- id: blender-useful-shortcuts
  title: 改変でよく使う Blender のショートカット
  reading: かいへんでよくつかうぶれんだーのしょーとかっと
  summary: リンク選択（L / Ctrl+L）、ループ選択（Alt+クリック）、対称選択（Shift+Ctrl+M）、非表示（H / Alt+H）、トランスフォーム適用（Ctrl+A）などは覚えておくと作業が大きく速くなります。
  body: |-
    | 操作 | キー | 用途 |
    |---|---|---|
    | サイドバー表示 | `N` | 位置・回転・スケールの数値確認 |
    | リンク選択 | `L`（カーソル下）/ `Ctrl+L` | つながったメッシュ（ボタン、服の一部）をまとめて選択 |
    | ループ選択 | `Alt+クリック` | 袖口・裾などの辺ループを選択 |
    | 対称位置の頂点を選択 | `Shift+Ctrl+M` | 左右で同じ編集をしたいとき（選択 → 対称選択） |
    | 非表示 / 再表示 | `H` / `Alt+H` | 編集したくない頂点を隠す |
    | 選択以外を非表示 | `Shift+H` | 作業対象だけを残す |
    | 適用メニュー | `Ctrl+A` | スケール・回転などを適用（全トランスフォーム） |
    | 結合 | `Ctrl+J` | オブジェクト（メッシュ・アーマチュア）の結合 |
    | 分離 | `P` | 選択部分を別オブジェクトにする |
    | プロポーショナル編集 | `O` | 周囲の頂点もなめらかに動かす（ホイールで範囲） |
    | ポーズのリセット | `Alt+G` / `Alt+R` / `Alt+S` | ポーズモードで位置・回転・拡縮を初期化 |
    | ピボット変更 | `.`（ピリオド） | 回転・拡縮の中心（3D カーソル、個々の原点など） |
    | 3D カーソル | `Shift+S` | カーソルをワールド原点などへ移動 |

    - 複数オブジェクトの同じ値を一括変更するには、値を変更するときに `Alt` を押しながら確定します（[Alt で一括変更](/tips#blender-alt-multi-edit)）。
  tags: [Blender]
  shortcuts: [L, Ctrl+L, Alt+クリック, Ctrl+Shift+M, H, Alt+H, Ctrl+A]
  source: discord

- id: blender-alt-multi-edit
  title: 複数オブジェクトの値を一括で変更する（Alt を押しながら）
  reading: ふくすうおぶじぇくとのあたいをいっかつでへんこうする（おるとをおしながら）
  summary: 複数オブジェクトを選択した状態で、プロパティの値を Alt を押しながら変更・確定すると、選択中のすべてのオブジェクトに同じ値が入ります。
  body: |-
    - 通常はアクティブ（最後に選んだ）オブジェクトの値しか変わりません。
    - 値の入力欄で `Alt` を押しながら Enter で確定する、または `Alt` を押しながらドラッグ・チェックボックスをクリックすると、選択中の全オブジェクトに反映されます。
    - モディファイアーの設定値やオブジェクトプロパティの一括変更に便利です。
  tags: [Blender]
  source: discord

- id: blender-undo-steps
  title: Blender の「元に戻す」回数を増やす
  reading: ぶれんだーの「もとにもどす」かいすうをふやす
  summary: Preferences の System → Undo Steps で元に戻せる回数を増やせます。増やしすぎるとメモリを多く使う点に注意します。バージョンを上げると設定が別になるので再設定が必要です。
  body: |-
    - `Edit > Preferences > System > Memory & Limits` の **Undo Steps** を増やします（初期値は 32）。
    - 値を大きくするとメモリ使用量が増えます。PC のメモリに合わせて調整してください。
    - 新しいバージョンの Blender は設定が別に保存されるので、バージョンアップ後に戻し忘れに注意します。
  tags: [Blender]
  source: discord

- id: proportional-edit-connected-only
  title: プロポーショナル編集で別パーツまで動いてしまうのを防ぐ（接続のみ）
  reading: ぷろぽーしょなるへんしゅうでべつぱーつまでうごいてしまうのをふせぐ（せつぞくのみ）
  summary: プロポーショナル編集の設定で「接続のみ（Connected Only）」にチェックを入れると、つながっているメッシュだけが影響を受けます。結合済みの服とボタンや素体が一緒に動くのを防げます。
  body: |-
    - 3D ビューポート上部のプロポーショナル編集アイコン横のメニューで **接続のみ（Connected Only）** を有効にします。
    - 素体と服を結合（`Ctrl+J`）した状態でプロポーショナル編集を使うと、服を動かしたつもりで素体まで動き、タイツが凹むなどの原因になります。
    - 代わりに、動かしたくない頂点を `H` で非表示にする方法もあります（[編集したくない部分を固定する](/tips#hide-vertices-while-editing)）。
    - プロポーショナル編集を使わないときは `O` でオフにします。
  tags: [Blender]
  shortcuts: [O]
  articles: [avatar-clothing/base-shape]
  source: discord

- id: hide-vertices-while-editing
  title: ボタンなど変形させたくない部分を固定して編集する
  reading: ぼたんなどへんけいさせたくないぶぶんをこていしてへんしゅうする
  summary: 服の形を変えるとき、ボタンやリボンなど形を保ちたいパーツは先に H で非表示にしておき、本体の調整後に位置だけ合わせるのが基本です。
  body: |-
    1. 編集モードでボタンなどを `L`（リンク選択）で選び、`H` で非表示にします。
    2. 服本体をプロポーショナル編集などで調整します。
    3. `Alt+H` で再表示し、ボタンを移動・回転で配置し直します。
    - 選択部分だけ編集不可にする有料アドオン（Hide Only Vertex / Lock Vertex）もあります。
    - プロポーショナル編集の「接続のみ」を使えば、つながっていないパーツは最初から影響を受けません。
  tags: [Blender, 衣装]
  shortcuts: [H, Alt+H]
  source: discord

- id: restore-symmetry
  title: 左右対称だった頂点がずれた（ミラーが外れた）ときの直し方
  reading: さゆうたいしょうだったちょうてんがずれた（みらーがはずれた）ときのなおしかた
  summary: わずかなずれなら Blender 標準の「対称にスナップ（Snap to Symmetry）」で戻せることがあります。より確実に復元したい場合は RestoreSymmetry 系のアドオンを使います。
  body: |-
    - 編集モードで対象の頂点を選び、`メッシュ > 対称にスナップ（Snap to Symmetry）` を実行します。許容範囲内の頂点を対称位置に揃えます（大きなずれは直りません）。
    - RestoreSymmetry アドオン: 左右非対称になったオブジェクトを対称に復元します。元は Blender 2.7 向けを 2.8 以降で動くように改修したもので、当時 3.0 でも動作した報告があります。最新版向けの fork もあります。
    - アドオン（.py 単体）の入れ方: `Edit > Preferences > Add-ons` → 右上のメニューから `Install from Disk...` で .py を選択して有効化します（Blender 4.2 以降のメニュー名。古いバージョンでは `Install...`）。
    - 元ファイルの時点でミラーが外れている頂点が混ざっていることもあります。
  tags: [Blender]
  source: discord

- id: looptools
  title: LoopTools でガタついたループをなめらかに整える
  reading: るーぷつーるずでがたついたるーぷをなめらかにととのえる
  summary: LoopTools の Circle / Relax / Space などを使うと、シュリンクラップしたソックスの縁や、ボーンで縮めてガタついた部分をきれいに揃えられます。
  body: |-
    - 用途の例
      - シュリンクラップしたソックス・タイツの縁を整える（Circle、Space）
      - 胸のサイズ変更などでガタついたメッシュを均す（Relax）
    - 導入: Blender 4.2 以降は `Edit > Preferences > Get Extensions` から LoopTools を検索してインストールします（以前は標準同梱アドオンで、有効化するだけでした）。
    - 使い方: 編集モードで辺ループを選択 → 右クリックメニューの LoopTools から実行します。
