name: Deploy (production)

# 本番（https://avatar.fara-labs.com/ 。Worker fara-avatar）への公開。master に push（develop → master の PR のマージ。ユーザーが行う）されるたびに実行。
# 手動で再実行したいときは Actions タブから master を選んで Run workflow。
# 自分でビルドして公開する（成果物は使わない）。ビルドとテストは build.yml が同じ push で行う。
#
# kit の tools/maintenance.mjs（一括変更 CLI）と set-maintenance-all.yml は、この workflow の手動実行（workflow_dispatch の入力）を使う。
# 入力の名前・型を変えるときは、kit の docs/maintenance-cli.md の雛形と、tests/FaraAvatarModdingGuide.Web.Tests/DeployWorkflowTests.cs も直す。

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_maintenance_check:
        description: "MAINTENANCE_MODE=notice の確認を飛ばして公開する（緊急の修正用。お知らせなしで公開され、メンテナンス画面にもならない）"
        type: boolean
        default: false
      maintenance_mode:
        description: "メンテナンス表示の切り替え。true = 全体メンテナンス（全ページがメンテナンス画面・503）、notice = お知らせ帯、false = 通常。空 = 変更しない"
        type: choice
        options: ["", "true", "notice", "false"]
        default: ""
      maintenance_message:
        description: "お知らせ・メンテナンス画面に出す文（200 文字まで・改行なし）。空 = 変更しない"
        type: string
        default: ""
      first_publish:
        description: "本番の Worker がまだ無いとき（初回の公開）だけ true。Worker が無いことを通し、メンテナンス画面のまま作る（MAINTENANCE_MODE の確認は、いつもどおり飛ばさない）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  # 公開の途中で中断すると、アセットが中途半端な状態になりうるので、後から来た分は待たせる
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare (production)
    runs-on: ubuntu-latest
    # 手動実行で別のブランチを選んでも、本番には master だけを公開する
    if: github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://avatar.fara-labs.com
    steps:
      # worker/index.js が external/fara-site-kit の report.js・maintenance.js を読み込むので、submodule も取得する
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish web (WebAssembly)
        run: dotnet publish src/FaraAvatarModdingGuide.Web -c Release --nologo -o publish

      # 本番用のビルド（sitemap あり・noindex なし）を、wrangler.toml の assets（./dist）に作る
      - name: Build static pages (production)
        run: |
          rm -rf dist && cp -r publish/wwwroot dist
          dotnet run --project src/FaraAvatarModdingGuide.Build -c Release --no-launch-profile -- --template publish/wwwroot/index.html --out dist --env production

      # 一式が本番用のものか。確認用の出力を本番へ出す取り違えは、ここで止める
      - name: Verify the output matches the target
        run: node .github/scripts/verify-site.mjs dist production

      # 本番の公開は、Cloudflare の Worker の変数 MAINTENANCE_MODE が notice（更新予定のお知らせを出している）のときだけ行う。
      # 確認できないとき・notice でないときは、ここで止める（手動実行の skip_maintenance_check で飛ばせる）。
      # Worker が無い（404）ときも止める。Worker 名の誤りでも 404 になるので、初回の公開（手動実行の first_publish = true）のときだけ通す。
      # 通した初回の公開は、次の公開のステップが MAINTENANCE_MODE:true を付けるので、メンテナンス画面のまま作られる。
      # mode に true / notice / false のどれかを指定した手動実行（maintenance-cli の set）は、操作した人の意思なので、確認を飛ばす
      - name: Require MAINTENANCE_MODE=notice (production)
        if: ${{ !contains(fromJSON('["true","notice","false"]'), inputs.maintenance_mode) }}
        run: node .github/scripts/require-maintenance.mjs fara-avatar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SKIP_MAINTENANCE_CHECK: ${{ inputs.skip_maintenance_check }}
          ALLOW_MISSING_WORKER: ${{ inputs.first_publish && '1' || '' }}

      # 文面の検査（200 文字まで・改行なし）。--var に渡す前に止める
      - name: Check the maintenance message
        run: node .github/scripts/maintenance-deploy.mjs check-message
        env:
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}

      # 入力はシェルに直接埋め込まず、環境変数で受ける。空の入力には --var を付けない（keep_vars で現在の値が保持される）。
      # push と、何も指定しない手動実行は、公開と同時に MAINTENANCE_MODE=true（メンテナンス画面）にする。作業が終わったら false に戻す（お知らせも一緒に消える）。
      #   skip_maintenance_check のときは付けない。mode を指定した手動実行は、指定した値。message だけの手動実行は、mode を変えない。
      # 最初に、ブランチの取り違えを止める（production は master だけ）
      - name: Deploy to Cloudflare Workers
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then echo "::error::production へは master からしか公開しません ($GITHUB_REF)"; exit 1; fi
          vars=()
          if [ -n "$MAINTENANCE_MODE_INPUT" ]; then
            vars+=(--var "MAINTENANCE_MODE:$MAINTENANCE_MODE_INPUT")
          elif [ -z "$MAINTENANCE_MESSAGE_INPUT" ] && [ "$SKIP_MAINTENANCE_CHECK" != "true" ]; then
            vars+=(--var "MAINTENANCE_MODE:true")
          fi
          if [ -n "$MAINTENANCE_MESSAGE_INPUT" ]; then vars+=(--var "MAINTENANCE_MESSAGE:$MAINTENANCE_MESSAGE_INPUT"); fi
          npx --yes wrangler@4.149.0 deploy --env production "${vars[@]}"
        env:
          MAINTENANCE_MODE_INPUT: ${{ inputs.maintenance_mode }}
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}
          SKIP_MAINTENANCE_CHECK: ${{ inputs.skip_maintenance_check }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # 設定した値と、反映後の現在値を、ジョブサマリーに出す（公開が失敗したときも出す）。文面は出してよい。トークンは出さない。
      # 内容は .github/scripts/maintenance-deploy.mjs（develop と共通）。取得できなくても失敗にはしない
      - name: Summary (maintenance)
        if: ${{ always() }}
        run: node .github/scripts/maintenance-deploy.mjs summary >> "$GITHUB_STEP_SUMMARY"
        env:
          MAINTENANCE_MODE_INPUT: ${{ inputs.maintenance_mode }}
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}
          WORKER_NAME: fara-avatar
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
