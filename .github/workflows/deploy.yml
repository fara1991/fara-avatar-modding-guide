name: Build and Deploy

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_maintenance_check:
        description: "MAINTENANCE_MODE=notice の確認を飛ばして公開する（緊急の修正用。お知らせなしで公開され、メンテナンス画面にもならない）"
        type: boolean
        default: false
      maintenance_mode:
        description: "メンテナンス表示の切り替え。true = 全体メンテナンス（全ページがメンテナンス画面・503）、notice = お知らせ帯、false = 通常。空 = 変更しない"
        type: choice
        options: ["", "true", "notice", "false"]
        default: ""
      maintenance_message:
        description: "お知らせ・メンテナンス画面に出す文（200 文字まで・改行なし）。空 = 変更しない"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      # external/fara-site-kit（共通部品。Build の build-pages.mjs が使う）を取得する
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Build.Tests が kit の Node ツール（build/build-pages.mjs）を実際に呼ぶ
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Test
        run: dotnet test -c Release --no-build --nologo

      # 報告の受け口・メンテナンスの判定は共通部品（external/fara-site-kit/worker）。Worker の入口（worker/index.js）のテストと一緒に動かす
      - name: Worker tests (report, maintenance, entry)
        run: node --test external/fara-site-kit/worker/report.test.mjs external/fara-site-kit/worker/maintenance.test.mjs worker/index.test.mjs

      - name: Deploy gate test
        run: node --test .github/scripts/require-maintenance.test.mjs

      - name: Export static site
        run: dotnet run -c Release --no-build --no-launch-profile -- --export dist

      # 検索の判定を、書き出した実際の索引（dist/search-index.json）で確かめる（書き出しの後）
      - name: Search script test
        run: node --test tests/js/search.test.mjs

      # --- 移行先（Blazor WebAssembly + MudBlazor。docs/wasm-migration-plan.md）の確認。公開はしない（確認用への公開は deploy-wasm-dev.yml） ---
      - name: Browser script tests (storage migration, default theme, search normaliser, compare tool, notice banner, practice entry)
        run: node --test tests/js/storage-migrate.test.mjs tests/js/theme-default.test.mjs tests/js/search-norm-fn.test.mjs tests/js/compare-text.test.mjs tests/js/notice.test.mjs tests/js/practice-entry.test.mjs tests/js/head-sync.test.mjs

      - name: Publish web (WebAssembly)
        run: dotnet publish src/FaraAvatarModdingGuide.Web -c Release --nologo -o publish

      # 本文入りの静的 HTML・データの JSON・404.html・_redirects・_headers を、publish/wwwroot に書き足す（kit の build-pages.mjs を使う）
      - name: Build static pages
        run: dotnet run --project src/FaraAvatarModdingGuide.Build -c Release --no-launch-profile -- --template publish/wwwroot/index.html --out publish/wwwroot --env develop --dev-origin https://avatar-wasm-dev.fara-labs.com

      # 現行の SSR 版(develop のコード)を、別に書き出す。移行版の本文の検証用。
      # 同じコミットの SSR は、記事を読み込む部分(src/FaraAvatarModdingGuide.Content)を移行版と共有していて、食い違いが見えないので、develop の SSR を別に取得する。
      # Content/ と appsettings.json だけは、この移行版のものに差し替える(記事が同じ内容のときの、描き方の違いだけを見る)
      - uses: actions/checkout@v4
        with:
          ref: develop
          path: ssr-develop

      - name: Export the SSR site from develop
        run: |
          rm -rf ssr-develop/Content
          cp -r Content ssr-develop/Content
          cp appsettings.json ssr-develop/appsettings.json
          dotnet run -c Release --project ssr-develop --no-launch-profile -- --export "$PWD/dist-ssr"

      # 記事 50 件の本文(文字と、href・src などの属性)と、そのほかのページの本文が、develop の SSR 版の書き出しと一致すること(計画書 8。既知の差は tools/compare/known-differences.json)
      - name: Compare pages with the SSR export from develop
        run: node tools/compare/compare-text.mjs dist-ssr publish/wwwroot

      # 検索の索引の正規化が、現行の searchcore.js と一致すること
      - name: Search index normalisation test
        run: node tests/js/search-norm.mjs publish/wwwroot/data/search.json

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: build
    # PR では build だけ行い、master / develop への push（と手動実行）でデプロイする。
    # 手動実行は master / develop を選んだときだけ（ほかのブランチで確認用サイトを上書きしない）
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'master' && 'production' || 'develop' }}
      url: ${{ github.ref_name == 'master' && 'https://avatar.fara-labs.com' || 'https://avatar-dev.fara-labs.com' }}
    steps:
      # worker/index.js が external/fara-site-kit の report.js・maintenance.js を読み込むので、wrangler がバンドルできるよう submodule も取得する
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      # 確認用（develop）が検索結果に載らないようにする（ポケモンのサイトと同じ。worker/index.js も確認用のホストに付ける）
      - name: Add noindex header (develop)
        if: github.ref_name != 'master'
        run: |
          cat >> dist/_headers <<'HEADERS'
          /*
            X-Robots-Tag: noindex, nofollow
          HEADERS

      # 本番（master）の公開は、Cloudflare の Worker の変数 MAINTENANCE_MODE が notice（更新予定のお知らせを出している）のときだけ行う。
      # 確認できないとき・notice でないときは、ここで止める（手動実行の skip_maintenance_check で飛ばせる）。確認用（develop）は確認しない。
      # mode に true / notice / false のどれかを指定した手動実行（maintenance-cli の set）は、操作した人の意思なので、確認を飛ばす
      - name: Require MAINTENANCE_MODE=notice (production)
        if: github.ref_name == 'master' && !contains(fromJSON('["true","notice","false"]'), inputs.maintenance_mode)
        run: node .github/scripts/require-maintenance.mjs fara-avatar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SKIP_MAINTENANCE_CHECK: ${{ inputs.skip_maintenance_check }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 入力はシェルに直接埋め込まず、環境変数で受ける。空の入力には --var を付けない（keep_vars で現在の値が保持される）。
      # 本番（master）: push と、何も指定しない手動実行は、従来どおり公開と同時に MAINTENANCE_MODE=true（メンテナンス画面）にする。作業が終わったら false に戻す（お知らせも一緒に消える）。
      #   skip_maintenance_check のときは付けない。mode を指定した手動実行は、指定した値。message だけの手動実行は、mode を変えない。
      # 確認用（develop）: 入力があるときだけ付ける
      - name: Deploy to Cloudflare Workers
        shell: bash
        run: |
          vars=()
          if [ "$DEPLOY_ENV" = "production" ]; then
            if [ -n "$MAINTENANCE_MODE_INPUT" ]; then
              vars+=(--var "MAINTENANCE_MODE:$MAINTENANCE_MODE_INPUT")
            elif [ -z "$MAINTENANCE_MESSAGE_INPUT" ] && [ "$SKIP_MAINTENANCE_CHECK" != "true" ]; then
              vars+=(--var "MAINTENANCE_MODE:true")
            fi
          elif [ -n "$MAINTENANCE_MODE_INPUT" ]; then
            vars+=(--var "MAINTENANCE_MODE:$MAINTENANCE_MODE_INPUT")
          fi
          if [ -n "$MAINTENANCE_MESSAGE_INPUT" ]; then vars+=(--var "MAINTENANCE_MESSAGE:$MAINTENANCE_MESSAGE_INPUT"); fi
          npx --yes wrangler@4.149.0 deploy --env "$DEPLOY_ENV" "${vars[@]}"
        env:
          DEPLOY_ENV: ${{ github.ref_name == 'master' && 'production' || 'dev' }}
          MAINTENANCE_MODE_INPUT: ${{ inputs.maintenance_mode }}
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}
          SKIP_MAINTENANCE_CHECK: ${{ inputs.skip_maintenance_check }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # 設定した値と、反映後の現在値を、ジョブサマリーに出す（公開が失敗したときも出す）。文面は出してよい。トークンは出さない
      - name: Summary (maintenance)
        if: ${{ always() }}
        shell: bash
        run: |
          msg="$(printf '%s' "$MAINTENANCE_MESSAGE_INPUT" | tr '`' '"')"
          {
            echo "### メンテナンス表示 (${WORKER_NAME})"
            echo "- 設定した値: MAINTENANCE_MODE=\`${MAINTENANCE_MODE_INPUT:-(変更なし)}\` / MAINTENANCE_MESSAGE=\`${msg:-(変更なし)}\`"
            node -e '
              const j = (v) => JSON.stringify(v);
              fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${process.env.WORKER_NAME}/settings`, { headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } })
                .then((r) => r.json())
                .then((b) => {
                  const list = b?.result?.bindings ?? [];
                  const v = (n) => { const x = list.find((y) => y.name === n); return x ? (x.type === "plain_text" ? j(x.text).replaceAll("`", "'") : `(${x.type})`) : "(未設定)"; };
                  console.log(`- 反映後の現在値: MAINTENANCE_MODE=\`${v("MAINTENANCE_MODE")}\` / MAINTENANCE_MESSAGE=\`${v("MAINTENANCE_MESSAGE")}\``);
                })
                .catch(() => console.log("- 反映後の現在値: 取得できませんでした"));
            '
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MAINTENANCE_MODE_INPUT: ${{ inputs.maintenance_mode }}
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}
          WORKER_NAME: ${{ github.ref_name == 'master' && 'fara-avatar' || 'fara-avatar-dev' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
