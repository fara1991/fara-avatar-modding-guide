name: Build and Deploy

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_maintenance_check:
        description: "MAINTENANCE=notice の確認を飛ばして公開する（緊急の修正用。お知らせなしで公開され、メンテナンス画面にもならない）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Test
        run: dotnet test -c Release --no-build --nologo

      - name: Report endpoint test
        run: node --test worker/report.test.mjs worker/maintenance.test.mjs

      - name: Deploy gate test
        run: node --test .github/scripts/require-maintenance.test.mjs

      - name: Page navigation script test
        run: node --test tests/js/nav.test.mjs tests/js/search.test.mjs

      - name: Export static site
        run: dotnet run -c Release --no-build --no-launch-profile -- --export dist

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: build
    # PR では build だけ行い、master / develop への push（と手動実行）でデプロイする。
    # 手動実行は master / develop を選んだときだけ（ほかのブランチで確認用サイトを上書きしない）
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'master' && 'production' || 'develop' }}
      url: ${{ github.ref_name == 'master' && 'https://avatar.fara-labs.com' || 'https://avatar-dev.fara-labs.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      # 確認用（develop）が検索結果に載らないようにする（ポケモンのサイトと同じ。worker/index.js も確認用のホストに付ける）
      - name: Add noindex header (develop)
        if: github.ref_name != 'master'
        run: |
          cat >> dist/_headers <<'HEADERS'
          /*
            X-Robots-Tag: noindex, nofollow
          HEADERS

      # 本番（master）の公開は、Cloudflare の Worker の変数 MAINTENANCE が notice（更新予定のお知らせを出している）のときだけ行う。
      # 確認できないとき・notice でないときは、ここで止める（手動実行の skip_maintenance_check で飛ばせる）。確認用（develop）は確認しない
      - name: Require MAINTENANCE=notice (production)
        if: github.ref_name == 'master'
        run: node .github/scripts/require-maintenance.mjs fara-avatar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SKIP_MAINTENANCE_CHECK: ${{ inputs.skip_maintenance_check }}

      - uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.149.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # 本番は、公開と同時に MAINTENANCE=true（メンテナンス画面）にする。作業が終わったら、Cloudflare で false に戻す（お知らせも一緒に消える）。確認を飛ばしたときは、メンテナンス画面にしない
          command: deploy --env ${{ github.ref_name == 'master' && 'production' || 'dev' }}${{ github.ref_name == 'master' && !inputs.skip_maintenance_check && ' --var MAINTENANCE:true' || '' }}
