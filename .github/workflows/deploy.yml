name: Build and Deploy

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Test
        run: dotnet test -c Release --no-build --nologo

      - name: Report endpoint test
        run: node --test worker/report.test.mjs

      - name: Export static site
        run: dotnet run -c Release --no-build --no-launch-profile -- --export dist

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: build
    # PR では build だけ行い、master / develop への push（と手動実行）でデプロイする。
    # 手動実行は master / develop を選んだときだけ（ほかのブランチで確認用サイトを上書きしない）
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'master' && 'production' || 'develop' }}
      url: ${{ github.ref_name == 'master' && 'https://avatar.fara-labs.com' || 'https://avatar-dev.fara-labs.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      # 確認用（develop）が検索結果に載らないようにする（ポケモンのサイトと同じ。worker/index.js も確認用のホストに付ける）
      - name: Add noindex header (develop)
        if: github.ref_name != 'master'
        run: |
          cat >> dist/_headers <<'HEADERS'
          /*
            X-Robots-Tag: noindex, nofollow
          HEADERS

      - uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.149.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ github.ref_name == 'master' && 'production' || 'dev' }}
