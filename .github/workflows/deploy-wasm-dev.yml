name: Deploy to Cloudflare Workers (wasm-dev)

# 移行（Blazor WebAssembly + MudBlazor。docs/wasm-migration-plan.md の D14）の確認用。
# 長期ブランチ migration/wasm に push（PR のマージ含む）されるたびに、https://avatar-wasm-dev.fara-labs.com/ へ公開する。
# 本番（avatar.fara-labs.com）と develop の確認用（avatar-dev.fara-labs.com）には影響しない（別の Worker: fara-avatar-wasm-dev）。
# 本番への公開はしない（master への push だけが deploy.yml で本番に出る）。手動実行（workflow_dispatch）は、このファイルが既定のブランチにあるときだけ Actions タブに出る。migration/wasm の間は、過去の実行の再実行を使う。
#
# Worker とカスタムドメインは、最初の公開で自動で作られる。Cloudflare Access（自分だけが見られる設定）と、問い合わせ用の変数
# （TURNSTILE_SITE_KEY・TURNSTILE_SECRET・DISCORD_WEBHOOK_URL）は、Cloudflare のダッシュボードで設定する（wrangler.toml は keep_vars = true）。
on:
  push:
    branches: [migration/wasm]
    # 記事（Content/learn 以下の Markdown）も公開の対象なので、Markdown 全部は除外しない
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      maintenance_mode:
        description: "メンテナンス表示の切り替え。true = 全体メンテナンス（全ページがメンテナンス画面・503）、notice = お知らせ帯、false = 通常。空 = 変更しない"
        type: choice
        options: ["", "true", "notice", "false"]
        default: ""
      maintenance_message:
        description: "お知らせ・メンテナンス画面に出す文（200 文字まで・改行なし）。空 = 変更しない"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-wasm-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy (wasm-dev)
    runs-on: ubuntu-latest
    # 手動実行（Run workflow）で別のブランチを選んでも、公開するのは migration/wasm だけ（ほかのブランチで確認用サイトを上書きしない）
    if: github.ref == 'refs/heads/migration/wasm'
    environment:
      name: wasm-dev
      url: https://avatar-wasm-dev.fara-labs.com/
    steps:
      # external/fara-site-kit（共通部品）を取得する。Build（build-pages.mjs）・Web（Razor）・Worker（report.js・maintenance.js）が使う
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 公開の前に、テストを通す（Build.Tests は kit の Node ツールを実際に呼ぶ。CI 環境では Node・submodule が無いと飛ばさず失敗する）
      - name: Test
        run: dotnet test -c Release --nologo

      - name: Worker and script tests
        run: node --test external/fara-site-kit/worker/report.test.mjs external/fara-site-kit/worker/maintenance.test.mjs worker/index.test.mjs tests/js/storage-migrate.test.mjs tests/js/theme-default.test.mjs tests/js/search-norm-fn.test.mjs tests/js/compare-text.test.mjs tests/js/notice.test.mjs tests/js/practice-entry.test.mjs

      # サイトはカスタムドメインのルートで公開するので、<base href="/" /> はそのまま
      - name: Publish web (WebAssembly)
        run: dotnet publish src/FaraAvatarModdingGuide.Web -c Release --nologo -o publish

      # 本文入りの静的 HTML（76 本）・404.html・データの JSON・robots.txt・_headers（CSP・確認用の X-Robots-Tag: noindex）・_redirects を、publish/wwwroot に書き足す。
      # 確認用のホスト名（canonical・フッターの作者リンクの切り替え）は --dev-origin で渡す（tools/site.json の devOrigin は、移行後の avatar-dev）
      - name: Build static pages (develop)
        run: dotnet run --project src/FaraAvatarModdingGuide.Build -c Release --no-launch-profile -- --template publish/wwwroot/index.html --out publish/wwwroot --env develop --dev-origin https://avatar-wasm-dev.fara-labs.com

      # 現行の SSR 版(develop のコード)を、別に書き出す。移行版の本文の検証用。
      # 同じコミットの SSR は、記事を読み込む部分(src/FaraAvatarModdingGuide.Content)を移行版と共有していて、食い違いが見えないので、develop の SSR を別に取得する。
      # Content/ と appsettings.json だけは、この移行版のものに差し替える(記事が同じ内容のときの、描き方の違いだけを見る)
      - uses: actions/checkout@v4
        with:
          ref: develop
          path: ssr-develop

      - name: Export the SSR site from develop
        run: |
          rm -rf ssr-develop/Content
          cp -r Content ssr-develop/Content
          cp appsettings.json ssr-develop/appsettings.json
          dotnet run -c Release --project ssr-develop --no-launch-profile -- --export "$PWD/dist-ssr"

      # 記事 50 件の本文(文字と属性)と、そのほかのページの本文が、develop の SSR 版の書き出しと一致していること(develop の取り込みなどで、本文が食い違ったまま公開しない)
      - name: Compare pages with the SSR export from develop
        run: node tools/compare/compare-text.mjs dist-ssr publish/wwwroot

      # 入力はシェルに直接埋め込まず、環境変数で受ける。空の入力には --var を付けない（keep_vars で現在の値が保持される）。
      # push（入力なし）では --var を付けない: 確認用なので、メンテナンス画面にもならない。--env wasm-dev で、本番・develop とは別の Worker に出す
      - name: Deploy to Cloudflare Workers (wasm-dev)
        shell: bash
        run: |
          vars=()
          if [ -n "$MAINTENANCE_MODE_INPUT" ]; then vars+=(--var "MAINTENANCE_MODE:$MAINTENANCE_MODE_INPUT"); fi
          if [ -n "$MAINTENANCE_MESSAGE_INPUT" ]; then vars+=(--var "MAINTENANCE_MESSAGE:$MAINTENANCE_MESSAGE_INPUT"); fi
          npx --yes wrangler@4.149.0 deploy --env wasm-dev "${vars[@]}"
        env:
          MAINTENANCE_MODE_INPUT: ${{ inputs.maintenance_mode }}
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # 設定した値と、反映後の現在値を、ジョブサマリーに出す（公開が失敗したときも出す）。文面は出してよい。トークンは出さない
      - name: Summary (maintenance)
        if: ${{ always() }}
        shell: bash
        run: |
          msg="$(printf '%s' "$MAINTENANCE_MESSAGE_INPUT" | tr '`' '"')"
          {
            echo "### メンテナンス表示 (${WORKER_NAME})"
            echo "- 設定した値: MAINTENANCE_MODE=\`${MAINTENANCE_MODE_INPUT:-(変更なし)}\` / MAINTENANCE_MESSAGE=\`${msg:-(変更なし)}\`"
            node -e '
              const j = (v) => JSON.stringify(v);
              fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${process.env.WORKER_NAME}/settings`, { headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } })
                .then((r) => r.json())
                .then((b) => {
                  const list = b?.result?.bindings ?? [];
                  const v = (n) => { const x = list.find((y) => y.name === n); return x ? (x.type === "plain_text" ? j(x.text).replaceAll("`", "\u0027") : `(${x.type})`) : "(未設定)"; };
                  console.log(`- 反映後の現在値: MAINTENANCE_MODE=\`${v("MAINTENANCE_MODE")}\` / MAINTENANCE_MESSAGE=\`${v("MAINTENANCE_MESSAGE")}\``);
                })
                .catch(() => console.log("- 反映後の現在値: 取得できませんでした"));
            '
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MAINTENANCE_MODE_INPUT: ${{ inputs.maintenance_mode }}
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}
          WORKER_NAME: fara-avatar-wasm-dev
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
