name: Deploy (develop)

# 確認用（https://avatar-dev.fara-labs.com/ 。Worker fara-avatar-dev）への公開。develop に push（PR のマージ含む）されるたびに実行。
# 本番には影響しない。手動で再実行したいときは Actions タブから develop を選んで Run workflow。
# 自分でビルドして公開する（成果物は使わない）。ビルドとテストは build.yml が同じ push で行う。
#
# kit の tools/maintenance.mjs（一括変更 CLI）と set-maintenance-all.yml は、この workflow の手動実行（maintenance_mode / maintenance_message）を使う。
# 入力の名前・型を変えるときは、kit の docs/maintenance-cli.md の雛形と、tests/FaraAvatarModdingGuide.Web.Tests/DeployWorkflowTests.cs も直す。

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      maintenance_mode:
        description: "メンテナンス表示の切り替え。true = 全体メンテナンス（全ページがメンテナンス画面・503）、notice = お知らせ帯、false = 通常。空 = 変更しない"
        type: choice
        options: ["", "true", "notice", "false"]
        default: ""
      maintenance_message:
        description: "お知らせ・メンテナンス画面に出す文（200 文字まで・改行なし）。空 = 変更しない"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-develop
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare (develop)
    runs-on: ubuntu-latest
    # 手動実行で別のブランチを選んでも、確認用には develop だけを公開する
    if: github.ref == 'refs/heads/develop'
    environment:
      name: develop
      url: https://avatar-dev.fara-labs.com
    steps:
      # worker/index.js が external/fara-site-kit の report.js・maintenance.js を読み込むので、submodule も取得する
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish web (WebAssembly)
        run: dotnet publish src/FaraAvatarModdingGuide.Web -c Release --nologo -o publish

      # 確認用のビルド（noindex・sitemap なし）を、wrangler.toml の assets（./dist）に作る
      - name: Build static pages (develop)
        run: |
          rm -rf dist && cp -r publish/wwwroot dist
          dotnet run --project src/FaraAvatarModdingGuide.Build -c Release --no-launch-profile -- --template publish/wwwroot/index.html --out dist --env develop

      # 一式が確認用のものか。本番用の出力を確認用へ出す取り違えは、ここで止める
      - name: Verify the output matches the target
        run: node .github/scripts/verify-site.mjs dist develop

      # 文面の検査（200 文字まで・改行なし）。--var に渡す前に止める
      - name: Check the maintenance message
        run: node .github/scripts/maintenance-deploy.mjs check-message
        env:
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}

      # 入力はシェルに直接埋め込まず、環境変数で受ける。空の入力には --var を付けない（keep_vars で現在の値が保持される）。
      # 最初に、ブランチの取り違えを止める（dev は develop だけ）
      - name: Deploy to Cloudflare Workers (develop)
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then echo "::error::dev へは develop からしか公開しません ($GITHUB_REF)"; exit 1; fi
          vars=()
          if [ -n "$MAINTENANCE_MODE_INPUT" ]; then vars+=(--var "MAINTENANCE_MODE:$MAINTENANCE_MODE_INPUT"); fi
          if [ -n "$MAINTENANCE_MESSAGE_INPUT" ]; then vars+=(--var "MAINTENANCE_MESSAGE:$MAINTENANCE_MESSAGE_INPUT"); fi
          npx --yes wrangler@4.149.0 deploy --env dev "${vars[@]}"
        env:
          MAINTENANCE_MODE_INPUT: ${{ inputs.maintenance_mode }}
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # 設定した値と、反映後の現在値を、ジョブサマリーに出す（公開が失敗したときも出す）。文面は出してよい。トークンは出さない。
      # 内容は .github/scripts/maintenance-deploy.mjs（本番のファイルと共通）。取得できなくても失敗にはしない
      - name: Summary (maintenance)
        if: ${{ always() }}
        run: node .github/scripts/maintenance-deploy.mjs summary >> "$GITHUB_STEP_SUMMARY"
        env:
          MAINTENANCE_MODE_INPUT: ${{ inputs.maintenance_mode }}
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}
          WORKER_NAME: fara-avatar-dev
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
